<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Top 10 Git для тестировщиков</title>
<style>
  :root{
    --bg:#0a0e14;
    --panel:#11161f;
    --panel-border:#1f2733;
    --text:#e8edf2;
    --muted:#8a96a3;
    --green:#2ecc71;
    --cyan:#27c3e0;
    --orange:#f2a65a;
    --blue:#2e9bff;
    --red:#ff5f5f;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'SF Mono','JetBrains Mono',Consolas,monospace;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px;margin:0 auto;padding:18px 14px 40px;}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;}
  .back-link{
    display:inline-flex;align-items:center;gap:6px;
    color:var(--muted);text-decoration:none;
    font-size:12px;
    border:1px solid var(--panel-border);
    padding:5px 10px;border-radius:8px;
    transition:border-color .15s, color .15s;
  }
  .back-link:hover{border-color:var(--cyan);color:var(--cyan);}
  .lang-toggle{display:inline-flex;border:1px solid var(--panel-border);border-radius:8px;overflow:hidden;flex:0 0 auto;}
  .lang-toggle button{
    background:transparent;border:none;color:var(--muted);font-family:inherit;
    font-size:11px;font-weight:700;padding:5px 12px;cursor:pointer;letter-spacing:.3px;
  }
  .lang-toggle button.active{background:var(--cyan);color:#06161c;}

  h1{
    font-size:21px;
    text-align:center;
    margin:10px 0 18px;
    letter-spacing:.3px;
  }
  h1 span{color:var(--cyan);}
  .layout{display:flex;gap:14px;align-items:flex-start;}
  .list{
    flex:0 0 190px;
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:80vh;
    overflow-y:auto;
    position:sticky;
    top:10px;
  }
  .item{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:9px 10px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition:border-color .15s, background .15s;
  }
  .item:hover{border-color:var(--cyan);}
  .item.active{
    background:var(--cyan);
    color:#06161c;
    border-color:var(--cyan);
  }
  .badge{
    width:22px;height:22px;flex:0 0 22px;
    border-radius:50%;
    background:#1b2330;
    color:var(--green);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;
  }
  .item.active .badge{background:#06161c;color:var(--cyan);}
  .item .names{line-height:1.25;min-width:0;}
  .item .cmd{font-weight:700;font-size:13px;}
  .item .desc{font-size:10.5px;color:var(--muted);}
  .item.active .desc{color:#0a2630;}

  .panel{
    flex:1;
    min-width:0;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .term{
    background:#060a10;
    border:1px solid var(--panel-border);
    border-radius:10px;
    overflow:hidden;
  }
  .term-bar{
    display:flex;align-items:center;gap:6px;
    padding:8px 10px;
    border-bottom:1px solid var(--panel-border);
    font-size:11px;color:var(--muted);
  }
  .term-bar .dot{width:8px;height:8px;border-radius:50%;background:#444;}
  .term-title{flex:1;text-align:center;}
  .term-body{padding:12px 12px 14px;font-size:12.5px;overflow-x:auto;}
  .prompt{color:var(--green);}
  .cmdline{color:var(--text);}
  .out{color:var(--muted);margin-top:6px;font-size:12px;white-space:pre-wrap;line-height:1.5;}
  .add{color:#2ecc71;}
  .del{color:#ff5f5f;}
  .branch{color:#82aaff;}

  .section-title{
    display:flex;align-items:center;gap:6px;
    font-size:14px;font-weight:700;color:var(--cyan);
  }
  .category{
    display:inline-block;
    font-size:10.5px;
    padding:2px 8px;
    border-radius:999px;
    background:#102a1c;
    color:var(--green);
    border:1px solid #1c4a32;
  }
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}

  .block-title{
    font-size:11.5px;
    font-weight:700;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.6px;
    margin-top:4px;
  }
  .what{font-size:13px;color:var(--text);line-height:1.5;overflow-wrap:anywhere;}

  .breakdown{
    display:flex;
    flex-direction:column;
    gap:6px;
    background:#0b0f16;
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:10px;
  }
  .brow{display:flex;gap:8px;font-size:12px;line-height:1.4;flex-wrap:wrap;}
  .brow code{
    color:var(--cyan);
    background:#0e1a22;
    padding:1px 6px;
    border-radius:5px;
    flex:0 1 auto;
    max-width:100%;
    white-space:normal;
    word-break:break-word;
    font-weight:700;
  }
  .brow .expl{color:var(--muted);flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word;}

  .custom{
    font-size:12.5px;color:var(--text);
    border-left:2px solid var(--blue);
    padding-left:9px;
    line-height:1.55;
    overflow-wrap:anywhere;
  }
  .custom b{color:var(--blue);}
  .custom code{color:var(--cyan);background:#0e1a22;padding:1px 5px;border-radius:4px;}

  .tip{
    font-size:11.5px;color:var(--orange);
    border-left:2px solid var(--orange);
    padding-left:8px;
    line-height:1.5;
    overflow-wrap:anywhere;
  }
  .warn{
    font-size:11.5px;color:var(--red);
    border-left:2px solid var(--red);
    padding-left:8px;
    line-height:1.5;
    overflow-wrap:anywhere;
  }
  .footer{
    text-align:center;color:var(--muted);
    font-size:10.5px;margin-top:16px;
  }
  @media (max-width:560px){
    .layout{flex-direction:column;}
    .list{
      flex-direction:column;
      flex:none;
      max-height:none;
      overflow-y:visible;
      position:static;
      width:100%;
    }
    .panel{width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back-link" href="index.html" id="backLink">← На главную</a>
    <div class="lang-toggle" id="langToggle">
      <button data-lang="ru">RU</button><button data-lang="en">EN</button>
    </div>
  </div>
  <h1 id="pageTitle">Top 10 <span>Git</span> для тестировщиков</h1>
  <div class="layout">
    <div class="list" id="list"></div>
    <div class="panel" id="panel"></div>
  </div>
  <div class="footer" id="pageFooter">Git-команды для работы с автотестами и поиска регрессий</div>
</div>

<script>
const LANG_KEY = 'qa-cheatsheets-lang';

const pageTitleHTML = {
  ru: 'Top 10 <span>Git</span> для тестировщиков',
  en: 'Top 10 <span>Git</span> for Testers'
};

const labels = {
  ru: { back:"← На главную", footer:"Git-команды для работы с автотестами и поиска регрессий",
        what:"Для чего нужно", breakdown:"Разбор команды", custom:"Как применить в своей работе" },
  en: { back:"← Home", footer:"Git commands for working with automated tests and hunting regressions",
        what:"When to use it", breakdown:"Command breakdown", custom:"How to apply it in your work" }
};

const toolsData = {
ru: [
  {cmd:"git clone", name:"Скачать репозиторий", cat:"Начало работы",
   line:"git clone https://github.com/team/qa-automation.git",
   out:"Cloning into 'qa-automation'...\nremote: Counting objects: 1204\nReceiving objects: 100%",
   what:"Скачивает полную копию репозитория (код + вся история изменений) на вашу машину. Это первый шаг, чтобы получить проект с автотестами и начать с ним работать.",
   breakdown:[
     {c:"https://.../qa-automation.git", e:"адрес репозитория — берётся на GitHub/GitLab с кнопки 'Clone'"}
   ],
   custom:"Замените URL на адрес реального репозитория <b>вашего</b> проекта с автотестами — его даёт тимлид или DevOps при онбординге.",
   tip:"Для приватных репозиториев потребуется настроить SSH-ключ или токен доступа — без них git clone завершится ошибкой авторизации."},

  {cmd:"git status", name:"Что изменилось", cat:"Основы",
   line:"git status",
   out:"On branch feature/login-tests\nChanges not staged for commit:\n  modified:   tests/login.spec.ts\nUntracked files:\n  tests/signup.spec.ts",
   what:"Показывает текущее состояние рабочей папки: какие файлы изменены, какие новые (ещё не отслеживаются Git), какие уже готовы к коммиту. Самая часто используемая команда — выполняйте её перед любым следующим шагом.",
   breakdown:[
     {c:"modified", e:"файл уже отслеживается Git и был изменён с последнего коммита"},
     {c:"Untracked files", e:"новый файл, про который Git ещё ничего не знает"},
     {c:"branch feature/login-tests", e:"название ветки, в которой вы сейчас находитесь"}
   ],
   custom:"Запускайте git status в <b>вашем</b> репозитории перед git add/commit — так вы точно увидите, что именно собираетесь закоммитить, и не отправите случайно лишний файл.",
   tip:"git status можно вызывать сколько угодно раз — она ничего не меняет в репозитории, только показывает текущее состояние."},

  {cmd:"git pull / fetch", name:"Получить изменения", cat:"Синхронизация",
   line:"git pull origin main",
   out:"Updating 8f2c1a0..1d44bb2\nFast-forward\n tests/checkout.spec.ts | 14 +++++++++-----",
   what:"Скачивает последние изменения из удалённого репозитория и применяет их к вашей локальной ветке. Нужно делать регулярно, чтобы ваши тесты не 'отставали' от актуального кода коллег.",
   breakdown:[
     {c:"git fetch", e:"только скачивает изменения, не применяя их к рабочей папке — безопасно посмотреть, что нового"},
     {c:"git pull", e:"по сути fetch + merge — сразу применяет скачанные изменения к текущей ветке"},
     {c:"origin main", e:"откуда тянуть (origin — имя удалённого репозитория) и из какой ветки"}
   ],
   custom:"Выполняйте git pull в <b>вашем</b> репозитории каждое утро перед началом работы и перед запуском регрессионного набора — так вы тестируете актуальный код, а не вчерашнюю версию.",
   tip:"Если pull ругается на конфликты — сначала сохраните свои незакоммиченные изменения через git stash (см. ниже), потом повторите pull."},

  {cmd:"git branch / checkout", name:"Переключение веток", cat:"Основы",
   line:"git checkout -b bugfix/cart-total",
   out:"Switched to a new branch 'bugfix/cart-total'",
   what:"Ветки — это параллельные 'версии' кода. Переключение между ними позволяет, например, сравнить поведение бага на старой и новой версии фичи, или создать отдельную ветку для своих тестовых скриптов.",
   breakdown:[
     {c:"git branch", e:"показать список всех локальных веток, текущая отмечена звёздочкой"},
     {c:"git checkout &lt;ветка&gt;", e:"переключиться на уже существующую ветку"},
     {c:"git checkout -b &lt;имя&gt;", e:"создать новую ветку и сразу переключиться на неё"}
   ],
   custom:"Перед написанием новых автотестов для фичи <b>вашего</b> проекта создайте отдельную ветку (bugfix/... или test/...) — так ваши изменения не смешаются с чужими до code review.",
   tip:"git switch — более новая и понятная команда специально для переключения веток, появилась как альтернатива многозначному checkout."},

  {cmd:"git log", name:"История коммитов", cat:"Диагностика",
   line:"git log --oneline -5",
   out:"1d44bb2 fix: cart total rounding\n8f2c1a0 feat: add promo code field\na93e7c1 test: checkout flow e2e\n5b0f2aa fix: null pointer on empty cart",
   what:"Показывает историю коммитов — кто, когда и что менял. Незаменим, когда нужно понять, в каком именно изменении появился баг, или найти контекст перед тем, как заводить баг-репорт.",
   breakdown:[
     {c:"--oneline", e:"компактный вывод — один коммит на строку вместо подробного блока"},
     {c:"-5", e:"показать только последние 5 коммитов"},
     {c:"git log -- файл", e:"история изменений только по конкретному файлу"}
   ],
   custom:"Если баг в <b>вашем</b> приложении появился 'недавно', посмотрите git log по затронутому файлу/модулю за последние дни — часто там сразу видно подозрительный коммит перед багом.",
   tip:"git log --author=\"имя\" — отфильтровать историю по конкретному автору, если знаете, кто вероятно вносил изменение."},

  {cmd:"git diff", name:"Что именно изменилось", cat:"Диагностика",
   line:"git diff HEAD~1 HEAD -- src/cart.ts",
   out:"- const total = price * qty;\n+ const total = Math.round(price * qty * 100) / 100;",
   what:"Построчно показывает разницу между двумя состояниями кода (например текущими изменениями и последним коммитом, или двумя разными коммитами). Помогает понять, что именно поменялось в логике.",
   breakdown:[
     {c:"- строка", e:"была удалена (старый вариант кода)"},
     {c:"+ строка", e:"была добавлена (новый вариант кода)"},
     {c:"HEAD~1 HEAD", e:"сравнить предыдущий коммит с текущим"},
     {c:"-- src/cart.ts", e:"ограничить сравнение только одним файлом"}
   ],
   custom:"Когда разработчик говорит 'я поправил округление суммы' в <b>вашем</b> проекте — посмотрите git diff по этому коммиту, чтобы понять точную логику изменения и придумать точные граничные тест-кейсы под него.",
   tip:"git diff без аргументов показывает ваши собственные незакоммиченные изменения — удобно для финальной проверки перед коммитом."},

  {cmd:"git add / commit", name:"Сохранение изменений", cat:"Основы",
   line:"git add tests/checkout.spec.ts\ngit commit -m \"test: add coupon validation cases\"",
   out:"[bugfix/cart-total 3a7f901] test: add coupon validation cases\n 1 file changed, 24 insertions(+)",
   what:"add помечает файл как готовый к сохранению ('staged'), commit — фиксирует изменения в истории репозитория с пояснительным сообщением. Так ваши новые тест-кейсы попадают в общую историю проекта.",
   breakdown:[
     {c:"git add &lt;файл&gt;", e:"добавить конкретный файл в индекс перед коммитом (или git add . — все изменённые файлы)"},
     {c:"git commit -m \"...\"", e:"зафиксировать изменения с сообщением, объясняющим ЧТО и иногда ЗАЧЕМ"}
   ],
   custom:"Пишите сообщение коммита так, чтобы коллега через месяц понял суть без открытия diff — например 'test: add coupon validation cases' понятнее, чем просто 'fix'.",
   tip:"Коммитьте небольшими логическими порциями (один набор тест-кейсов = один коммит) — так проще откатить именно проблемную часть, если что-то пошло не так."},

  {cmd:"git stash", name:"Временно отложить изменения", cat:"Повседневное",
   line:"git stash\ngit pull origin main\ngit stash pop",
   out:"Saved working directory and index state WIP on bugfix/cart-total\n...\nDropped stash@{0}",
   what:"Временно 'прячет' ваши незакоммиченные изменения, возвращая рабочую папку к чистому состоянию последнего коммита — не теряя их. Удобно, когда нужно быстро переключиться на другую задачу или подтянуть изменения без конфликтов.",
   breakdown:[
     {c:"git stash", e:"сохранить текущие незакоммиченные изменения в 'тайник' и очистить рабочую папку"},
     {c:"git stash pop", e:"вернуть последние отложенные изменения обратно"},
     {c:"git stash list", e:"посмотреть все отложенные наборы изменений, если их несколько"}
   ],
   custom:"Используйте stash в <b>вашем</b> репозитории, когда пишете тест, но срочно нужно переключиться на другую ветку проверить баг — не обязательно коммитить недописанный код, чтобы не потерять его.",
   tip:"git stash — это именно 'временно', не используйте как постоянное хранилище незавершённой работы: легко забыть, что там лежит."},

  {cmd:"git bisect", name:"Найти коммит, сломавший тест", cat:"Поиск регрессий",
   line:"git bisect start\ngit bisect bad HEAD\ngit bisect good v2.3.0",
   out:"Bisecting: 6 revisions left to test after this (roughly 3 steps)\n[a93e7c1] feat: redesign checkout summary",
   what:"Автоматизированный бинарный поиск 'плохого' коммита: вы говорите Git, где точно всё было хорошо (good) и где точно уже сломано (bad), и он последовательно предлагает коммиты посередине для проверки, пока не найдёт первый сломавший всё коммит.",
   breakdown:[
     {c:"git bisect start", e:"начать сессию поиска"},
     {c:"git bisect bad HEAD", e:"пометить текущее состояние как содержащее баг"},
     {c:"git bisect good v2.3.0", e:"пометить известную рабочую версию/тег как заведомо без бага"},
     {c:"git bisect good / bad (на каждом шаге)", e:"после проверки предложенного коммита — сказать Git, воспроизводится баг там или нет"}
   ],
   custom:"Если регрессионный тест в <b>вашем</b> проекте вдруг начал падать, а когда именно это случилось — неясно, используйте bisect между последней точно рабочей версией (тег релиза) и текущим HEAD — вместо ручного перебора десятков коммитов.",
   tip:"git bisect run ./run_test.sh может автоматически гонять ваш тестовый скрипт на каждом шаге и самостоятельно находить виновный коммит без ручного участия."},

  {cmd:"git blame", name:"Кто и когда менял строку", cat:"Диагностика",
   line:"git blame -L 40,45 src/checkout.ts",
   out:"a93e7c1 (Ivan Petrov  2026-10-20) 42)  const total = calcTotal(items, coupon);",
   what:"Показывает, в каком коммите, кем и когда была в последний раз изменена каждая конкретная строка файла. Полезно, чтобы быстро найти автора изменения и контекст (сообщение коммита), когда нужно уточнить логику перед заведением бага.",
   breakdown:[
     {c:"-L 40,45", e:"ограничить вывод диапазоном строк 40–45, а не весь файл целиком"},
     {c:"src/checkout.ts", e:"файл, по которому смотрим построчную историю"}
   ],
   custom:"Нашли подозрительную строку в коде <b>вашего</b> проекта во время code review тест-кейсов или дебага — git blame по этой строке покажет, у кого спросить про логику или контекст изменения.",
   tip:"Используйте вместе с -w, чтобы git blame игнорировал изменения только в пробелах/отступах и не 'терял' реального автора логики."}
],
en: [
  {cmd:"git clone", name:"Download a Repo", cat:"Getting Started",
   line:"git clone https://github.com/team/qa-automation.git",
   out:"Cloning into 'qa-automation'...\nremote: Counting objects: 1204\nReceiving objects: 100%",
   what:"Downloads a full copy of a repository (code + the entire change history) onto your machine. This is the first step to get the automated-test project and start working with it.",
   breakdown:[
     {c:"https://.../qa-automation.git", e:"the repo's address — grab it from GitHub/GitLab's 'Clone' button"}
   ],
   custom:"Swap the URL for the real address of <b>your</b> project's test-automation repo — your lead or DevOps gives you this during onboarding.",
   tip:"Private repos require an SSH key or access token set up — without one, git clone fails with an auth error."},

  {cmd:"git status", name:"What Changed", cat:"Basics",
   line:"git status",
   out:"On branch feature/login-tests\nChanges not staged for commit:\n  modified:   tests/login.spec.ts\nUntracked files:\n  tests/signup.spec.ts",
   what:"Shows the current state of your working folder: which files changed, which are new (not yet tracked by Git), which are already staged for commit. The most-used command — run it before any next step.",
   breakdown:[
     {c:"modified", e:"a file already tracked by Git that changed since the last commit"},
     {c:"Untracked files", e:"a new file Git doesn't know about yet"},
     {c:"branch feature/login-tests", e:"the name of the branch you're currently on"}
   ],
   custom:"Run git status in <b>your</b> repo before git add/commit — this lets you see exactly what you're about to commit, so you don't accidentally include a stray file.",
   tip:"git status can be run as many times as you like — it changes nothing in the repo, it only shows the current state."},

  {cmd:"git pull / fetch", name:"Getting Changes", cat:"Syncing",
   line:"git pull origin main",
   out:"Updating 8f2c1a0..1d44bb2\nFast-forward\n tests/checkout.spec.ts | 14 +++++++++-----",
   what:"Downloads the latest changes from the remote repository and applies them to your local branch. Do this regularly so your tests don't lag behind your teammates' current code.",
   breakdown:[
     {c:"git fetch", e:"only downloads changes without applying them to the working folder — safe to peek at what's new"},
     {c:"git pull", e:"effectively fetch + merge — immediately applies the downloaded changes to the current branch"},
     {c:"origin main", e:"where to pull from (origin — the remote repo's name) and which branch"}
   ],
   custom:"Run git pull in <b>your</b> repo every morning before starting work, and before running the regression suite — that way you're testing current code, not yesterday's.",
   tip:"If pull complains about conflicts, save your uncommitted changes with git stash first (see below), then pull again."},

  {cmd:"git branch / checkout", name:"Switching Branches", cat:"Basics",
   line:"git checkout -b bugfix/cart-total",
   out:"Switched to a new branch 'bugfix/cart-total'",
   what:"Branches are parallel 'versions' of code. Switching between them lets you, say, compare a bug's behavior on the old and new version of a feature, or create a separate branch for your own test scripts.",
   breakdown:[
     {c:"git branch", e:"show every local branch, with the current one marked by an asterisk"},
     {c:"git checkout &lt;branch&gt;", e:"switch to a branch that already exists"},
     {c:"git checkout -b &lt;name&gt;", e:"create a new branch and switch to it immediately"}
   ],
   custom:"Before writing new automated tests for a feature in <b>your</b> project, create a separate branch (bugfix/... or test/...) — that keeps your changes from mixing with others' before code review.",
   tip:"git switch is a newer, clearer command specifically for switching branches — it exists as an alternative to the overloaded checkout."},

  {cmd:"git log", name:"Commit History", cat:"Diagnostics",
   line:"git log --oneline -5",
   out:"1d44bb2 fix: cart total rounding\n8f2c1a0 feat: add promo code field\na93e7c1 test: checkout flow e2e\n5b0f2aa fix: null pointer on empty cart",
   what:"Shows the commit history — who changed what, and when. Essential when you need to figure out exactly which change introduced a bug, or find context before filing a bug report.",
   breakdown:[
     {c:"--oneline", e:"compact output — one commit per line instead of a verbose block"},
     {c:"-5", e:"show only the last 5 commits"},
     {c:"git log -- file", e:"change history for just one specific file"}
   ],
   custom:"If a bug in <b>your</b> app appeared 'recently', check git log for the affected file/module over the last few days — a suspicious commit right before the bug often jumps right out.",
   tip:"git log --author=\"name\" — filter the history by a specific author, if you suspect who made the change."},

  {cmd:"git diff", name:"What Exactly Changed", cat:"Diagnostics",
   line:"git diff HEAD~1 HEAD -- src/cart.ts",
   out:"- const total = price * qty;\n+ const total = Math.round(price * qty * 100) / 100;",
   what:"Shows a line-by-line diff between two states of the code (e.g. your current changes vs the last commit, or two different commits). Helps you understand exactly what changed in the logic.",
   breakdown:[
     {c:"- line", e:"was removed (the old version of the code)"},
     {c:"+ line", e:"was added (the new version of the code)"},
     {c:"HEAD~1 HEAD", e:"compare the previous commit against the current one"},
     {c:"-- src/cart.ts", e:"restrict the comparison to a single file"}
   ],
   custom:"When a developer says 'I fixed the total rounding' in <b>your</b> project, check git diff for that commit to understand the exact logic change and design precise boundary test cases for it.",
   tip:"git diff with no arguments shows your own uncommitted changes — handy for a final check before committing."},

  {cmd:"git add / commit", name:"Saving Changes", cat:"Basics",
   line:"git add tests/checkout.spec.ts\ngit commit -m \"test: add coupon validation cases\"",
   out:"[bugfix/cart-total 3a7f901] test: add coupon validation cases\n 1 file changed, 24 insertions(+)",
   what:"add marks a file as ready to be saved ('staged'), commit records the change in the repo's history with an explanatory message. This is how your new test cases become part of the project's shared history.",
   breakdown:[
     {c:"git add &lt;file&gt;", e:"add a specific file to the index before committing (or git add . for every changed file)"},
     {c:"git commit -m \"...\"", e:"record the change with a message explaining WHAT, and sometimes WHY"}
   ],
   custom:"Write commit messages so a colleague a month from now understands the point without opening the diff — e.g. 'test: add coupon validation cases' is clearer than just 'fix'.",
   tip:"Commit in small logical chunks (one set of test cases = one commit) — it's much easier to roll back just the problematic part if something goes wrong."},

  {cmd:"git stash", name:"Shelving Changes Temporarily", cat:"Day-to-Day",
   line:"git stash\ngit pull origin main\ngit stash pop",
   out:"Saved working directory and index state WIP on bugfix/cart-total\n...\nDropped stash@{0}",
   what:"Temporarily 'hides' your uncommitted changes, returning the working folder to the clean state of the last commit, without losing them. Handy when you need to quickly switch tasks or pull changes without conflicts.",
   breakdown:[
     {c:"git stash", e:"save the current uncommitted changes into a 'stash' and clean the working folder"},
     {c:"git stash pop", e:"bring the most recently stashed changes back"},
     {c:"git stash list", e:"see every stashed change set, if there's more than one"}
   ],
   custom:"Use stash in <b>your</b> repo when you're mid-way through writing a test but urgently need to switch branches to check a bug — no need to commit unfinished code just to avoid losing it.",
   tip:"git stash is meant to be 'temporary' — don't use it as permanent storage for unfinished work, it's easy to forget what's sitting in there."},

  {cmd:"git bisect", name:"Finding the Commit That Broke a Test", cat:"Finding Regressions",
   line:"git bisect start\ngit bisect bad HEAD\ngit bisect good v2.3.0",
   out:"Bisecting: 6 revisions left to test after this (roughly 3 steps)\n[a93e7c1] feat: redesign checkout summary",
   what:"An automated binary search for the 'bad' commit: you tell Git a point where everything was definitely fine (good) and a point where it's definitely broken (bad), and it offers commits in between for you to check, one by one, until it finds the first commit that broke things.",
   breakdown:[
     {c:"git bisect start", e:"begin the search session"},
     {c:"git bisect bad HEAD", e:"mark the current state as containing the bug"},
     {c:"git bisect good v2.3.0", e:"mark a known-working version/tag as definitely bug-free"},
     {c:"git bisect good / bad (at each step)", e:"after checking the suggested commit, tell Git whether the bug reproduces there or not"}
   ],
   custom:"If a regression test in <b>your</b> project suddenly starts failing and it's unclear exactly when that happened, use bisect between the last known-good version (a release tag) and the current HEAD — instead of manually trawling through dozens of commits.",
   tip:"git bisect run ./run_test.sh can automatically run your test script at each step and find the guilty commit on its own, with no manual involvement."},

  {cmd:"git blame", name:"Who Changed a Line, and When", cat:"Diagnostics",
   line:"git blame -L 40,45 src/checkout.ts",
   out:"a93e7c1 (Ivan Petrov  2026-10-20) 42)  const total = calcTotal(items, coupon);",
   what:"Shows which commit, by whom, and when, last changed each specific line of a file. Useful for quickly finding the author and context (the commit message) when you need to clarify the logic before filing a bug.",
   breakdown:[
     {c:"-L 40,45", e:"limit the output to the line range 40–45, instead of the whole file"},
     {c:"src/checkout.ts", e:"the file whose line-by-line history you're looking at"}
   ],
   custom:"Found a suspicious line of code in <b>your</b> project during a test-case review or while debugging? git blame on that line shows who to ask about the logic or the context of the change.",
   tip:"Combine with -w so git blame ignores whitespace-only changes and doesn't 'lose' the real author of the logic."}
]
};

const list = document.getElementById('list');
const panel = document.getElementById('panel');
let currentIndex = 0;
let currentLang = localStorage.getItem(LANG_KEY) || 'ru';

function render(i){
  currentIndex = i;
  const tools = toolsData[currentLang];
  const L = labels[currentLang];

  list.innerHTML = tools.map((t,idx)=>`
    <div class="item ${idx===i?'active':''}" data-i="${idx}">
      <div class="badge">${idx+1}</div>
      <div class="names">
        <div class="cmd">${t.cmd}</div>
        <div class="desc">${t.name}</div>
      </div>
    </div>`).join('');

  const t = tools[i];
  const breakdownHTML = t.breakdown.map(b=>`
    <div class="brow"><code>${b.c}</code><span class="expl">${b.e}</span></div>
  `).join('');

  const lines = t.line.split('\n').map(l=>`<div><span class="prompt">~$</span> <span class="cmdline">${l}</span></div>`).join('');

  panel.innerHTML = `
    <div class="term">
      <div class="term-bar">
        <div class="dot" style="background:#ff5f56"></div>
        <div class="dot" style="background:#ffbd2e"></div>
        <div class="dot" style="background:#27c93f"></div>
        <div class="term-title">user@qa: ~/qa-automation (<span class="branch">feature/login-tests</span>)</div>
      </div>
      <div class="term-body">
        ${lines}
        <div class="out">${t.out}</div>
      </div>
    </div>

    <div class="section-title">🔀 ${t.cmd}</div>
    <div class="meta"><span class="category">${t.cat}</span></div>

    <div class="block-title">${L.what}</div>
    <div class="what">${t.what}</div>

    <div class="block-title">${L.breakdown}</div>
    <div class="breakdown">${breakdownHTML}</div>

    <div class="block-title">${L.custom}</div>
    <div class="custom">${t.custom}</div>

    ${t.tip ? `<div class="tip">💡 ${t.tip}</div>` : ''}
    ${t.warn ? `<div class="warn">⚠️ ${t.warn}</div>` : ''}
  `;

  list.querySelectorAll('.item').forEach(el=>{
    el.onclick = ()=>render(parseInt(el.dataset.i));
  });
}

function applyLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang === 'ru' ? 'ru' : 'en';
  document.getElementById('backLink').textContent = labels[lang].back;
  document.getElementById('pageFooter').textContent = labels[lang].footer;
  document.getElementById('pageTitle').innerHTML = pageTitleHTML[lang];
  document.querySelectorAll('#langToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  localStorage.setItem(LANG_KEY, lang);
  const idx = Math.min(currentIndex, toolsData[lang].length - 1);
  render(idx);
}

document.querySelectorAll('#langToggle button').forEach(b => {
  b.addEventListener('click', () => applyLang(b.dataset.lang));
});

applyLang(currentLang);
</script>
