<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Top 10 Linux для тестировщиков</title>
<style>
  :root{
    --bg:#0a0e14;
    --panel:#11161f;
    --panel-border:#1f2733;
    --text:#e8edf2;
    --muted:#8a96a3;
    --green:#2ecc71;
    --cyan:#27c3e0;
    --orange:#f2a65a;
    --blue:#2e9bff;
    --red:#ff5f5f;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'SF Mono','JetBrains Mono',Consolas,monospace;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px;margin:0 auto;padding:18px 14px 40px;}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;}
  .back-link{
    display:inline-flex;align-items:center;gap:6px;
    color:var(--muted);text-decoration:none;
    font-size:12px;
    border:1px solid var(--panel-border);
    padding:5px 10px;border-radius:8px;
    transition:border-color .15s, color .15s;
  }
  .back-link:hover{border-color:var(--cyan);color:var(--cyan);}
  .lang-toggle{display:inline-flex;border:1px solid var(--panel-border);border-radius:8px;overflow:hidden;flex:0 0 auto;}
  .lang-toggle button{
    background:transparent;border:none;color:var(--muted);font-family:inherit;
    font-size:11px;font-weight:700;padding:5px 12px;cursor:pointer;letter-spacing:.3px;
  }
  .lang-toggle button.active{background:var(--cyan);color:#06161c;}

  h1{
    font-size:21px;
    text-align:center;
    margin:10px 0 18px;
    letter-spacing:.3px;
  }
  h1 span{color:var(--cyan);}
  .layout{display:flex;gap:14px;align-items:flex-start;}
  .list{
    flex:0 0 190px;
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:80vh;
    overflow-y:auto;
    position:sticky;
    top:10px;
  }
  .item{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:9px 10px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition:border-color .15s, background .15s;
  }
  .item:hover{border-color:var(--cyan);}
  .item.active{
    background:var(--cyan);
    color:#06161c;
    border-color:var(--cyan);
  }
  .badge{
    width:22px;height:22px;flex:0 0 22px;
    border-radius:50%;
    background:#1b2330;
    color:var(--green);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;
  }
  .item.active .badge{background:#06161c;color:var(--cyan);}
  .item .names{line-height:1.25;min-width:0;}
  .item .cmd{font-weight:700;font-size:13px;}
  .item .desc{font-size:10.5px;color:var(--muted);}
  .item.active .desc{color:#0a2630;}

  .panel{
    flex:1;
    min-width:0;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .term{
    background:#060a10;
    border:1px solid var(--panel-border);
    border-radius:10px;
    overflow:hidden;
  }
  .term-bar{
    display:flex;align-items:center;gap:6px;
    padding:8px 10px;
    border-bottom:1px solid var(--panel-border);
    font-size:11px;color:var(--muted);
  }
  .term-bar .dot{width:8px;height:8px;border-radius:50%;background:#444;}
  .term-title{flex:1;text-align:center;}
  .term-body{padding:12px 12px 14px;font-size:13px;overflow-x:auto;}
  .prompt{color:var(--green);}
  .cmdline{color:var(--text);}
  .out{color:var(--muted);margin-top:6px;font-size:12px;white-space:pre-wrap;line-height:1.5;}

  .section-title{
    display:flex;align-items:center;gap:6px;
    font-size:14px;font-weight:700;color:var(--cyan);
  }
  .category{
    display:inline-block;
    font-size:10.5px;
    padding:2px 8px;
    border-radius:999px;
    background:#102a1c;
    color:var(--green);
    border:1px solid #1c4a32;
  }
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}

  .block-title{
    font-size:11.5px;
    font-weight:700;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.6px;
    margin-top:4px;
  }
  .what{font-size:13px;color:var(--text);line-height:1.5;overflow-wrap:anywhere;}

  .breakdown{
    display:flex;
    flex-direction:column;
    gap:6px;
    background:#0b0f16;
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:10px;
  }
  .brow{display:flex;gap:8px;font-size:12px;line-height:1.4;flex-wrap:wrap;}
  .brow code{
    color:var(--cyan);
    background:#0e1a22;
    padding:1px 6px;
    border-radius:5px;
    flex:0 1 auto;
    max-width:100%;
    white-space:normal;
    word-break:break-word;
    font-weight:700;
  }
  .brow .expl{color:var(--muted);flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word;}

  .custom{
    font-size:12.5px;color:var(--text);
    border-left:2px solid var(--blue);
    padding-left:9px;
    line-height:1.55;
    overflow-wrap:anywhere;
  }
  .custom b{color:var(--blue);}
  .custom code{color:var(--cyan);background:#0e1a22;padding:1px 5px;border-radius:4px;}

  .tip{
    font-size:11.5px;color:var(--orange);
    border-left:2px solid var(--orange);
    padding-left:8px;
    line-height:1.5;
    overflow-wrap:anywhere;
  }
  .warn{
    font-size:11.5px;color:var(--red);
    border-left:2px solid var(--red);
    padding-left:8px;
    line-height:1.5;
    overflow-wrap:anywhere;
  }
  .footer{
    text-align:center;color:var(--muted);
    font-size:10.5px;margin-top:16px;
  }
  @media (max-width:560px){
    .layout{flex-direction:column;}
    .list{
      flex-direction:column;
      flex:none;
      max-height:none;
      overflow-y:visible;
      position:static;
      width:100%;
    }
    .panel{width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back-link" href="index.html" id="backLink">← На главную</a>
    <div class="lang-toggle" id="langToggle">
      <button data-lang="ru">RU</button><button data-lang="en">EN</button>
    </div>
  </div>
  <h1 id="pageTitle">Top 10 <span>Linux</span> для тестировщиков</h1>
  <div class="layout">
    <div class="list" id="list"></div>
    <div class="panel" id="panel"></div>
  </div>
  <div class="footer" id="pageFooter">Linux-команды, полезные в повседневной работе QA</div>
</div>

<script>
const LANG_KEY = 'qa-cheatsheets-lang';

const pageTitleHTML = {
  ru: 'Top 10 <span>Linux</span> для тестировщиков',
  en: 'Top 10 <span>Linux</span> Commands for Testers'
};

const labels = {
  ru: { back:"← На главную", footer:"Linux-команды, полезные в повседневной работе QA",
        what:"Для чего нужно", breakdown:"Разбор команды", custom:"Как применить в своей работе" },
  en: { back:"← Home", footer:"Linux commands useful in everyday QA work",
        what:"When to use it", breakdown:"Command breakdown", custom:"How to apply it in your work" }
};

const toolsData = {
ru: [
  {cmd:"grep", name:"Поиск в логах", cat:"Логи",
   line:"grep -i \"error\" app.log",
   out:"09:02:14 ERROR db connection timeout\n09:05:40 Error: payment failed",
   what:"Ищет строки, содержащие заданный текст или паттерн, в файле или потоке. Для тестировщика это главный инструмент быстро найти нужную ошибку в многотысячестрочном логе, не открывая файл вручную.",
   breakdown:[
     {c:"-i", e:"игнорировать регистр (найдёт и ERROR, и error, и Error)"},
     {c:"\"error\"", e:"искомая строка или регулярное выражение"},
     {c:"app.log", e:"файл, в котором ищем"}
   ],
   custom:"Замените <b>app.log</b> на реальный путь к логу <b>вашего</b> приложения (часто это /var/log/..., либо лог контейнера). Добавьте <code>-n</code> чтобы видеть номер строки, <code>-C 3</code> — чтобы показать 3 строки контекста вокруг найденной.",
   tip:"grep -r \"текст\" ./logs/ — рекурсивный поиск по всем файлам в папке, полезно когда логов несколько."},

  {cmd:"tail -f", name:"Мониторинг лога в реальном времени", cat:"Логи",
   line:"tail -f -n 50 app.log",
   out:"09:10:01 INFO request received\n09:10:02 INFO response 200 OK\n[ожидание новых строк...]",
   what:"Показывает последние строки файла и продолжает выводить новые строки по мере их появления — незаменимо, когда нужно смотреть лог 'вживую' во время ручного теста или прогона автотестов.",
   breakdown:[
     {c:"-f", e:"follow — не завершать работу, а ждать и выводить новые добавленные строки"},
     {c:"-n 50", e:"сначала показать последние 50 строк, а не весь файл"}
   ],
   custom:"Запустите эту команду в отдельном терминале перед тем, как воспроизводить баг в <b>вашем</b> приложении — так вы увидите именно те строки лога, что появились в момент проблемы.",
   tip:"Ctrl+C останавливает слежение за файлом, сам файл при этом не меняется."},

  {cmd:"curl", name:"Запрос к API", cat:"Сеть/API",
   line:"curl -i -X POST https://api.site/login -d '{\"user\":\"a@b.com\"}' -H \"Content-Type: application/json\"",
   out:"HTTP/1.1 200 OK\n{\"token\":\"eyJhbGciOi...\"}",
   what:"Отправляет HTTP-запрос прямо из терминала и показывает ответ — быстрый способ проверить API-эндпоинт без написания кода или открытия Postman.",
   breakdown:[
     {c:"-i", e:"показать заголовки ответа, а не только тело"},
     {c:"-X POST", e:"HTTP-метод запроса (по умолчанию GET)"},
     {c:"-d '{...}'", e:"тело запроса"},
     {c:"-H \"...\"", e:"заголовок запроса, например тип контента"}
   ],
   custom:"Замените URL на адрес реального эндпоинта <b>вашего</b> API и тело запроса — на корректные для него данные. Для авторизованных запросов добавьте <code>-H \"Authorization: Bearer &lt;токен&gt;\"</code>.",
   tip:"curl -o /dev/null -s -w \"%{http_code}\\n\" URL — выводит только HTTP-код ответа, удобно для быстрых smoke-проверок."},

  {cmd:"ps / kill", name:"Процессы приложения", cat:"Процессы",
   line:"ps aux | grep node",
   out:"user   4821  0.3  1.2  node server.js\nuser   4822  0.1  0.4  node worker.js",
   what:"ps показывает список запущенных процессов (что и под каким PID работает на машине), kill — отправляет процессу сигнал завершения. Полезно, когда нужно проверить, что тестируемый сервис запущен, или перезапустить 'зависший' процесс.",
   breakdown:[
     {c:"ps aux", e:"показать все процессы всех пользователей с подробностями (CPU, память)"},
     {c:"| grep node", e:"отфильтровать вывод, оставив только строки с 'node'"},
     {c:"kill -9 &lt;PID&gt;", e:"принудительно завершить процесс по его номеру (PID), взятому из вывода ps"}
   ],
   custom:"Замените <b>node</b> на имя процесса <b>вашего</b> приложения (java, python, nginx и т.д.) — так вы найдёте его PID и сможете убедиться, что сервис жив, перед стартом тестов.",
   warn:"kill -9 завершает процесс немедленно без возможности корректно закрыть соединения/сохранить данные — используйте для диагностики, не как штатный способ остановки сервиса."},

  {cmd:"netstat / ss", name:"Проверка портов", cat:"Сеть",
   line:"ss -tulpn | grep 3000",
   out:"tcp   LISTEN  0  128  0.0.0.0:3000  node",
   what:"Показывает, какие сетевые порты сейчас заняты и каким процессом — помогает быстро проверить, реально ли слушает порт тестируемый сервис, или понять, почему 'порт уже занят'.",
   breakdown:[
     {c:"-t", e:"только TCP-соединения"},
     {c:"-u", e:"включить UDP"},
     {c:"-l", e:"только слушающие (LISTEN) сокеты"},
     {c:"-p", e:"показать PID и имя процесса, занявшего порт"},
     {c:"-n", e:"показывать числовые адреса/порты, не резолвить имена — быстрее"}
   ],
   custom:"Замените <b>3000</b> на порт <b>вашего</b> тестируемого сервиса. Если видите 'Address already in use' при старте приложения — эта команда покажет, какой процесс уже занял нужный порт.",
   tip:"netstat — более старая команда с тем же смыслом; на современных дистрибутивах рекомендуется именно ss."},

  {cmd:"df / du", name:"Место на диске", cat:"Система",
   line:"df -h && du -sh ./test-artifacts",
   out:"/dev/sda1   40G   32G   6G   85%   /\n2.3G  ./test-artifacts",
   what:"df показывает свободное место на дисках/разделах, du — размер конкретной папки/файла. Пригождается, когда тесты падают из-за нехватки места (например при записи видео прогонов или больших логов).",
   breakdown:[
     {c:"df -h", e:"показать занятость дисков в человекочитаемом виде (ГБ вместо байт)"},
     {c:"du -sh &lt;путь&gt;", e:"суммарный размер (-s) конкретной папки в человекочитаемом виде (-h)"}
   ],
   custom:"Проверяйте этой командой CI-раннер или тестовый сервер, если автотесты начали падать с непонятными ошибками записи файлов — часто причина именно в заполненном диске от старых артефактов/скриншотов.",
   tip:"du -sh */ в папке с тестовыми артефактами быстро покажет, какая именно подпапка 'съедает' место."},

  {cmd:"chmod / chown", name:"Права доступа", cat:"Файлы",
   line:"chmod +x run_tests.sh",
   out:"-rwxr-xr-x  run_tests.sh",
   what:"chmod меняет права доступа к файлу (чтение/запись/выполнение), chown — меняет владельца файла. Частая причина 'Permission denied' при запуске скриптов автотестов на CI или чужой машине.",
   breakdown:[
     {c:"+x", e:"добавить право на выполнение файла как программы/скрипта"},
     {c:"chmod 644 файл", e:"числовая форма: владелец читает/пишет, остальные только читают"},
     {c:"chown user:group файл", e:"сменить владельца и группу файла"}
   ],
   custom:"Если скрипт запуска тестов <b>вашего</b> проекта выдаёт 'Permission denied: ./run_tests.sh' — выполните <code>chmod +x run_tests.sh</code> именно для этого файла.",
   tip:"В Git права на выполнение файла сохраняются при коммите — если скрипт теряет +x после клонирования, проверьте .gitattributes/настройки репозитория."},

  {cmd:"ssh / scp", name:"Доступ к серверу и копирование файлов", cat:"Удалённый доступ",
   line:"ssh user@192.168.1.10\nscp report.html user@192.168.1.10:/var/www/reports/",
   out:"Connected to 192.168.1.10\nreport.html  100%  340KB  2.1MB/s",
   what:"ssh открывает защищённую консоль на удалённой машине (например тестовом стенде), scp копирует файлы между локальной машиной и сервером по тому же защищённому каналу.",
   breakdown:[
     {c:"ssh user@host", e:"подключение к удалённому серверу под указанным пользователем"},
     {c:"scp файл user@host:путь", e:"копирование локального файла на сервер в указанную папку"},
     {c:"scp user@host:путь .", e:"обратное направление — скачать файл с сервера к себе"}
   ],
   custom:"Замените <b>user@192.168.1.10</b> на реальные учётные данные и адрес <b>вашего</b> тестового стенда (их обычно выдаёт DevOps/лид). Так можно, например, скачать логи сервера после упавшего теста для анализа.",
   tip:"Настройте SSH-ключи вместо пароля (ssh-copy-id) — ускоряет и упрощает регулярный доступ к стендам."},

  {cmd:"cat / less / head", name:"Просмотр файлов", cat:"Файлы",
   line:"less app.log",
   out:"(интерактивный просмотр, стрелки — листать, / — искать, q — выйти)",
   what:"Три способа посмотреть содержимое файла: cat выводит файл целиком сразу, head — только первые строки, less — открывает файл для постраничного/интерактивного просмотра, не загружая его целиком в терминал.",
   breakdown:[
     {c:"cat файл", e:"вывести весь файл целиком — подходит для маленьких файлов"},
     {c:"head -n 20 файл", e:"показать первые 20 строк — быстро глянуть начало большого файла"},
     {c:"less файл", e:"постраничный просмотр с поиском (/текст) — лучший выбор для больших логов"}
   ],
   custom:"Для больших лог-файлов <b>вашего</b> проекта всегда предпочитайте <code>less</code> вместо <code>cat</code> — cat на многомегабайтном файле 'завалит' терминал текстом.",
   tip:"Внутри less нажмите Shift+F — перейдёт в режим, аналогичный tail -f (слежение за новыми строками)."},

  {cmd:"top / htop", name:"Нагрузка на систему", cat:"Система",
   line:"htop",
   out:"CPU [||||||    42%]   MEM [||||||||  6.1G/16G]\nPID  USER  CMD\n4821 user  node server.js   38% CPU",
   what:"Показывает в реальном времени, сколько CPU и памяти потребляют процессы — критично при нагрузочном/стресс-тестировании, чтобы увидеть, не 'захлёбывается' ли тестируемый сервис.",
   breakdown:[
     {c:"top", e:"предустановлен почти везде, базовый интерфейс мониторинга процессов"},
     {c:"htop", e:"более удобная версия с цветным интерфейсом, сортировкой по клику и поиском процесса"}
   ],
   custom:"Запустите htop в отдельном окне терминала во время прогона нагрузочного теста <b>вашего</b> приложения — если CPU/память упираются в 100%, это объясняет деградацию времени ответа в результатах теста.",
   tip:"В htop нажмите F6, чтобы отсортировать процессы по использованию CPU или памяти и сразу увидеть 'тяжёлый' процесс."}
],
en: [
  {cmd:"grep", name:"Searching Logs", cat:"Logs",
   line:"grep -i \"error\" app.log",
   out:"09:02:14 ERROR db connection timeout\n09:05:40 Error: payment failed",
   what:"Searches for lines containing a given text or pattern in a file or stream. For a tester this is the main tool for quickly finding the right error in a log with thousands of lines, without opening the file by hand.",
   breakdown:[
     {c:"-i", e:"ignore case (matches ERROR, error, and Error alike)"},
     {c:"\"error\"", e:"the string or regular expression to search for"},
     {c:"app.log", e:"the file to search in"}
   ],
   custom:"Replace <b>app.log</b> with the real path to <b>your</b> app's log (often /var/log/..., or a container's log). Add <code>-n</code> to see line numbers, <code>-C 3</code> to show 3 lines of context around a match.",
   tip:"grep -r \"text\" ./logs/ — a recursive search across every file in a folder, handy when there are several logs."},

  {cmd:"tail -f", name:"Live Log Monitoring", cat:"Logs",
   line:"tail -f -n 50 app.log",
   out:"09:10:01 INFO request received\n09:10:02 INFO response 200 OK\n[waiting for new lines...]",
   what:"Shows the last lines of a file and keeps printing new lines as they appear — essential for watching a log 'live' during a manual test or an automated test run.",
   breakdown:[
     {c:"-f", e:"follow — keep running and print newly appended lines instead of exiting"},
     {c:"-n 50", e:"show the last 50 lines first, instead of the whole file"}
   ],
   custom:"Run this in a separate terminal before reproducing a bug in <b>your</b> app — you'll see exactly the log lines that appeared at the moment of the issue.",
   tip:"Ctrl+C stops following the file; the file itself is left unchanged."},

  {cmd:"curl", name:"API Request", cat:"Network/API",
   line:"curl -i -X POST https://api.site/login -d '{\"user\":\"a@b.com\"}' -H \"Content-Type: application/json\"",
   out:"HTTP/1.1 200 OK\n{\"token\":\"eyJhbGciOi...\"}",
   what:"Sends an HTTP request right from the terminal and shows the response — a fast way to check an API endpoint without writing code or opening Postman.",
   breakdown:[
     {c:"-i", e:"show response headers, not just the body"},
     {c:"-X POST", e:"the request's HTTP method (GET by default)"},
     {c:"-d '{...}'", e:"the request body"},
     {c:"-H \"...\"", e:"a request header, e.g. the content type"}
   ],
   custom:"Replace the URL with a real endpoint of <b>your</b> API and the request body with data that's valid for it. For authorized requests, add <code>-H \"Authorization: Bearer &lt;token&gt;\"</code>.",
   tip:"curl -o /dev/null -s -w \"%{http_code}\\n\" URL — prints only the HTTP status code, handy for quick smoke checks."},

  {cmd:"ps / kill", name:"App Processes", cat:"Processes",
   line:"ps aux | grep node",
   out:"user   4821  0.3  1.2  node server.js\nuser   4822  0.1  0.4  node worker.js",
   what:"ps lists running processes (what's running under which PID on the machine), kill sends a process a termination signal. Useful for checking that the service under test is actually running, or for restarting a 'stuck' process.",
   breakdown:[
     {c:"ps aux", e:"show every process from every user, with details (CPU, memory)"},
     {c:"| grep node", e:"filter the output down to lines containing 'node'"},
     {c:"kill -9 &lt;PID&gt;", e:"forcibly terminate a process by the PID taken from ps's output"}
   ],
   custom:"Replace <b>node</b> with <b>your</b> app's process name (java, python, nginx, etc.) — this finds its PID so you can confirm the service is alive before starting tests.",
   warn:"kill -9 terminates a process immediately with no chance to close connections or save data cleanly — use it for diagnostics, not as a routine way to stop a service."},

  {cmd:"netstat / ss", name:"Checking Ports", cat:"Network",
   line:"ss -tulpn | grep 3000",
   out:"tcp   LISTEN  0  128  0.0.0.0:3000  node",
   what:"Shows which network ports are currently in use and by which process — a fast way to confirm the service under test is really listening, or figure out why a port is 'already in use'.",
   breakdown:[
     {c:"-t", e:"TCP connections only"},
     {c:"-u", e:"include UDP"},
     {c:"-l", e:"listening sockets only"},
     {c:"-p", e:"show the PID and process name that holds the port"},
     {c:"-n", e:"show numeric addresses/ports instead of resolving names — faster"}
   ],
   custom:"Replace <b>3000</b> with the port of <b>your</b> service under test. If you see 'Address already in use' when starting the app, this command shows which process has already grabbed that port.",
   tip:"netstat is the older command with the same purpose; on modern distros, ss is the recommended choice."},

  {cmd:"df / du", name:"Disk Space", cat:"System",
   line:"df -h && du -sh ./test-artifacts",
   out:"/dev/sda1   40G   32G   6G   85%   /\n2.3G  ./test-artifacts",
   what:"df shows free space on disks/partitions, du shows the size of a specific folder/file. Useful when tests fail due to running out of space (e.g. while recording run videos or writing large logs).",
   breakdown:[
     {c:"df -h", e:"show disk usage in human-readable form (GB instead of bytes)"},
     {c:"du -sh &lt;path&gt;", e:"total size (-s) of a specific folder, human-readable (-h)"}
   ],
   custom:"Run this on a CI runner or test server if automated tests start failing with unclear file-write errors — it's often just a full disk from old artifacts/screenshots.",
   tip:"du -sh */ inside a test-artifacts folder quickly shows which specific subfolder is 'eating' space."},

  {cmd:"chmod / chown", name:"File Permissions", cat:"Files",
   line:"chmod +x run_tests.sh",
   out:"-rwxr-xr-x  run_tests.sh",
   what:"chmod changes a file's access permissions (read/write/execute), chown changes its owner. A common cause of 'Permission denied' when running test scripts on CI or someone else's machine.",
   breakdown:[
     {c:"+x", e:"add permission to execute the file as a program/script"},
     {c:"chmod 644 file", e:"numeric form: owner can read/write, everyone else can only read"},
     {c:"chown user:group file", e:"change the file's owner and group"}
   ],
   custom:"If <b>your</b> project's test-runner script reports 'Permission denied: ./run_tests.sh', run <code>chmod +x run_tests.sh</code> for that specific file.",
   tip:"Git preserves a file's execute permission on commit — if a script loses +x after cloning, check your .gitattributes/repo settings."},

  {cmd:"ssh / scp", name:"Server Access & File Copying", cat:"Remote Access",
   line:"ssh user@192.168.1.10\nscp report.html user@192.168.1.10:/var/www/reports/",
   out:"Connected to 192.168.1.10\nreport.html  100%  340KB  2.1MB/s",
   what:"ssh opens a secure console on a remote machine (e.g. a test environment), scp copies files between your local machine and a server over that same secure channel.",
   breakdown:[
     {c:"ssh user@host", e:"connect to a remote server as the given user"},
     {c:"scp file user@host:path", e:"copy a local file to a server, into the given folder"},
     {c:"scp user@host:path .", e:"the reverse direction — download a file from the server to your machine"}
   ],
   custom:"Replace <b>user@192.168.1.10</b> with the real credentials and address of <b>your</b> test environment (usually provided by DevOps/your lead). This lets you, for example, pull server logs after a failed test for analysis.",
   tip:"Set up SSH keys instead of a password (ssh-copy-id) — it speeds up and simplifies regular access to test environments."},

  {cmd:"cat / less / head", name:"Viewing Files", cat:"Files",
   line:"less app.log",
   out:"(interactive view: arrow keys to scroll, / to search, q to quit)",
   what:"Three ways to view a file's contents: cat dumps the whole file at once, head shows only the first lines, less opens the file for paginated/interactive viewing without loading it all into the terminal.",
   breakdown:[
     {c:"cat file", e:"print the entire file at once — fine for small files"},
     {c:"head -n 20 file", e:"show the first 20 lines — a quick look at the start of a large file"},
     {c:"less file", e:"paginated view with search (/text) — the best choice for large logs"}
   ],
   custom:"For large log files in <b>your</b> project, always prefer <code>less</code> over <code>cat</code> — cat on a multi-megabyte file will flood the terminal with text.",
   tip:"Inside less, press Shift+F to switch to a tail -f-like mode (following new lines)."},

  {cmd:"top / htop", name:"System Load", cat:"System",
   line:"htop",
   out:"CPU [||||||    42%]   MEM [||||||||  6.1G/16G]\nPID  USER  CMD\n4821 user  node server.js   38% CPU",
   what:"Shows in real time how much CPU and memory processes are consuming — critical during load/stress testing, to see whether the service under test is 'choking'.",
   breakdown:[
     {c:"top", e:"preinstalled almost everywhere, a basic process-monitoring interface"},
     {c:"htop", e:"a more convenient version with a colorized UI, click-to-sort, and process search"}
   ],
   custom:"Run htop in a separate terminal window while running a load test against <b>your</b> app — if CPU/memory hit 100%, that explains the response-time degradation in the test results.",
   tip:"In htop, press F6 to sort processes by CPU or memory usage and spot the 'heavy' process immediately."}
]
};

const list = document.getElementById('list');
const panel = document.getElementById('panel');
let currentIndex = 0;
let currentLang = localStorage.getItem(LANG_KEY) || 'ru';

function render(i){
  currentIndex = i;
  const tools = toolsData[currentLang];
  const L = labels[currentLang];

  list.innerHTML = tools.map((t,idx)=>`
    <div class="item ${idx===i?'active':''}" data-i="${idx}">
      <div class="badge">${idx+1}</div>
      <div class="names">
        <div class="cmd">${t.cmd}</div>
        <div class="desc">${t.name}</div>
      </div>
    </div>`).join('');

  const t = tools[i];
  const breakdownHTML = t.breakdown.map(b=>`
    <div class="brow"><code>${b.c}</code><span class="expl">${b.e}</span></div>
  `).join('');

  panel.innerHTML = `
    <div class="term">
      <div class="term-bar">
        <div class="dot" style="background:#ff5f56"></div>
        <div class="dot" style="background:#ffbd2e"></div>
        <div class="dot" style="background:#27c93f"></div>
        <div class="term-title">user@qa-host: ~</div>
      </div>
      <div class="term-body">
        <div><span class="prompt">~$</span> <span class="cmdline">${t.line.replace(/\n/g,'<br><span class="prompt">~$</span> ')}</span></div>
        <div class="out">${t.out}</div>
      </div>
    </div>

    <div class="section-title">🐧 ${t.cmd}</div>
    <div class="meta"><span class="category">${t.cat}</span></div>

    <div class="block-title">${L.what}</div>
    <div class="what">${t.what}</div>

    <div class="block-title">${L.breakdown}</div>
    <div class="breakdown">${breakdownHTML}</div>

    <div class="block-title">${L.custom}</div>
    <div class="custom">${t.custom}</div>

    ${t.tip ? `<div class="tip">💡 ${t.tip}</div>` : ''}
    ${t.warn ? `<div class="warn">⚠️ ${t.warn}</div>` : ''}
  `;

  list.querySelectorAll('.item').forEach(el=>{
    el.onclick = ()=>render(parseInt(el.dataset.i));
  });
}

function applyLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang === 'ru' ? 'ru' : 'en';
  document.getElementById('backLink').textContent = labels[lang].back;
  document.getElementById('pageFooter').textContent = labels[lang].footer;
  document.getElementById('pageTitle').innerHTML = pageTitleHTML[lang];
  document.querySelectorAll('#langToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  localStorage.setItem(LANG_KEY, lang);
  const idx = Math.min(currentIndex, toolsData[lang].length - 1);
  render(idx);
}

document.querySelectorAll('#langToggle button').forEach(b => {
  b.addEventListener('click', () => applyLang(b.dataset.lang));
});

applyLang(currentLang);
</script>
