<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Top 10 AI-промптов для QA</title>
<style>
  :root{
    --bg:#0a0e14;
    --panel:#11161f;
    --panel-border:#1f2733;
    --text:#e8edf2;
    --muted:#8a96a3;
    --green:#2ecc71;
    --cyan:#27c3e0;
    --orange:#f2a65a;
    --blue:#2e9bff;
    --red:#ff5f5f;
    --purple:#c792ea;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'SF Mono','JetBrains Mono',Consolas,monospace;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px;margin:0 auto;padding:18px 14px 40px;}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;}
  .back-link{
    display:inline-flex;align-items:center;gap:6px;
    color:var(--muted);text-decoration:none;
    font-size:12px;
    border:1px solid var(--panel-border);
    padding:5px 10px;border-radius:8px;
    transition:border-color .15s, color .15s;
  }
  .back-link:hover{border-color:var(--cyan);color:var(--cyan);}
  .lang-toggle{display:inline-flex;border:1px solid var(--panel-border);border-radius:8px;overflow:hidden;flex:0 0 auto;}
  .lang-toggle button{
    background:transparent;border:none;color:var(--muted);font-family:inherit;
    font-size:11px;font-weight:700;padding:5px 12px;cursor:pointer;letter-spacing:.3px;
  }
  .lang-toggle button.active{background:var(--cyan);color:#06161c;}

  h1{
    font-size:19px;
    text-align:center;
    margin:10px 0 18px;
    letter-spacing:.2px;
    line-height:1.3;
  }
  h1 span{color:var(--cyan);}
  .layout{display:flex;gap:14px;align-items:flex-start;}
  .list{
    flex:0 0 205px;
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:80vh;
    overflow-y:auto;
    position:sticky;
    top:10px;
  }
  .item{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:9px 10px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition:border-color .15s, background .15s;
  }
  .item:hover{border-color:var(--cyan);}
  .item.active{
    background:var(--cyan);
    color:#06161c;
    border-color:var(--cyan);
  }
  .badge{
    width:22px;height:22px;flex:0 0 22px;
    border-radius:50%;
    background:#1b2330;
    color:var(--green);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;
  }
  .item.active .badge{background:#06161c;color:var(--cyan);}
  .item .names{line-height:1.25;min-width:0;}
  .item .cmd{font-weight:700;font-size:12px;}
  .item .desc{font-size:10.5px;color:var(--muted);}
  .item.active .desc{color:#0a2630;}

  .panel{
    flex:1;
    min-width:0;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .term{
    background:#060a10;
    border:1px solid var(--panel-border);
    border-radius:10px;
    overflow:hidden;
  }
  .term-bar{
    display:flex;align-items:center;gap:8px;
    padding:8px 10px;
    border-bottom:1px solid var(--panel-border);
    font-size:11px;color:var(--muted);
    justify-content:space-between;
  }
  .term-bar .label{display:flex;align-items:center;gap:6px;}
  .term-bar .dot{width:8px;height:8px;border-radius:50%;background:#444;}
  .copy-btn{
    background:#1b2330;color:var(--cyan);border:1px solid var(--panel-border);
    border-radius:6px;padding:3px 9px;font-size:10.5px;cursor:pointer;
    font-family:inherit;
  }
  .copy-btn:hover{border-color:var(--cyan);}
  .copy-btn.copied{color:var(--green);border-color:var(--green);}
  .prompt-body{padding:12px 12px 14px;font-size:12.5px;white-space:pre-wrap;line-height:1.55;color:var(--text);}
  .ph{color:var(--orange);font-weight:700;}

  .sub-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:8px 12px 2px;border-top:1px solid var(--panel-border);}
  .example-out{padding:8px 12px 12px;font-size:11.5px;color:var(--muted);white-space:pre-wrap;line-height:1.5;}
  .ok{color:var(--green);}
  .jkey{color:#7fdbca;}
  .str{color:#c3e88d;}
  .num{color:#f78c6c;}

  .section-title{
    display:flex;align-items:center;gap:6px;
    font-size:14px;font-weight:700;color:var(--cyan);
  }
  .category{
    display:inline-block;
    font-size:10.5px;
    padding:2px 8px;
    border-radius:999px;
    background:#102a1c;
    color:var(--green);
    border:1px solid #1c4a32;
  }
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}

  .block-title{
    font-size:11.5px;
    font-weight:700;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.6px;
    margin-top:4px;
  }
  .what{font-size:13px;color:var(--text);line-height:1.5;overflow-wrap:anywhere;}

  .breakdown{
    display:flex;
    flex-direction:column;
    gap:6px;
    background:#0b0f16;
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:10px;
  }
  .brow{display:flex;gap:8px;font-size:12px;line-height:1.4;flex-wrap:wrap;}
  .brow code{
    color:var(--orange);
    background:#0e1a22;
    padding:1px 6px;
    border-radius:5px;
    flex:0 1 auto;
    max-width:100%;
    white-space:normal;
    word-break:break-word;
    font-weight:700;
  }
  .brow .expl{color:var(--muted);flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word;}

  .custom{
    font-size:12.5px;color:var(--text);
    border-left:2px solid var(--blue);
    padding-left:9px;
    line-height:1.55;
    overflow-wrap:anywhere;
  }
  .custom b{color:var(--blue);}
  .custom code{color:var(--cyan);background:#0e1a22;padding:1px 5px;border-radius:4px;}

  .tip{
    font-size:11.5px;color:var(--orange);
    border-left:2px solid var(--orange);
    padding-left:8px;
    line-height:1.5;
    overflow-wrap:anywhere;
  }
  .warn{
    font-size:11.5px;color:var(--red);
    border-left:2px solid var(--red);
    padding-left:8px;
    line-height:1.5;
    overflow-wrap:anywhere;
  }
  .footer{
    text-align:center;color:var(--muted);
    font-size:10.5px;margin-top:16px;
  }
  @media (max-width:560px){
    .layout{flex-direction:column;}
    .list{
      flex-direction:column;
      flex:none;
      max-height:none;
      overflow-y:visible;
      position:static;
      width:100%;
    }
    .panel{width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back-link" href="index.html" id="backLink">← На главную</a>
    <div class="lang-toggle" id="langToggle">
      <button data-lang="ru">RU</button><button data-lang="en">EN</button>
    </div>
  </div>
  <h1 id="pageTitle">Top 10 <span>AI-промптов</span> для QA</h1>
  <div class="layout">
    <div class="list" id="list"></div>
    <div class="panel" id="panel"></div>
  </div>
  <div class="footer" id="pageFooter">Готовые шаблоны промптов для повседневных задач тестировщика</div>
</div>

<script>
const LANG_KEY = 'qa-cheatsheets-lang';

const pageTitleHTML = {
  ru: 'Top 10 <span>AI-промптов</span> для QA',
  en: 'Top 10 <span>AI Prompts</span> for QA'
};

const labels = {
  ru: { back:"← На главную", footer:"Готовые шаблоны промптов для повседневных задач тестировщика",
        what:"Когда использовать", breakdown:"Разбор промпта", custom:"Как адаптировать под свой проект",
        promptTab:"prompt", copy:"Copy", copied:"Copied ✓", error:"Error", exampleOut:"Пример ответа AI" },
  en: { back:"← Home", footer:"Ready-made prompt templates for everyday testing tasks",
        what:"When to use it", breakdown:"Prompt breakdown", custom:"How to adapt it for your project",
        promptTab:"prompt", copy:"Copy", copied:"Copied ✓", error:"Error", exampleOut:"Example AI response" }
};

const toolsData = {
ru: [
  {cmd:"Тест-кейсы", name:"Из требований/user story", cat:"Проектирование",
   prompt:`Ты опытный QA-инженер. На основе требования ниже составь набор тест-кейсов.

Требование:
<span class="ph">[вставь текст user story или описание фичи]</span>

Для каждого тест-кейса укажи: заголовок, предусловия, шаги, ожидаемый результат.
Покрой: позитивные сценарии, негативные сценарии, граничные значения.
Формат: таблица.`,
   out:`| ID | Заголовок | Шаги | Ожидаемо |
| TC-01 | Успешный вход | ... | Переход в кабинет |
| TC-02 | Пустой пароль | ... | Ошибка валидации |
| TC-03 | 101 символ в поле | ... | Поле обрезано/ошибка |`,
   what:"Самый частый ежедневный запрос: превратить текст требования или тикета в структурированный набор тест-кейсов. AI хорошо находит очевидные позитивные сценарии и часть граничных случаев, но не заменяет ваше знание продукта — финальная проверка полноты всегда за вами.",
   breakdown:[
     {c:"роль (\"опытный QA-инженер\")", e:"задаёт контекст и стиль ответа — без неё модель чаще даёт более общий, менее профессиональный результат"},
     {c:"явное перечисление покрытия", e:"позитив/негатив/границы — без этой подсказки модель часто ограничивается только 'счастливым путём'"},
     {c:"формат ответа", e:"таблица — сразу удобно копировать в тест-кейс-менеджер (TestRail, Zephyr, Excel)"}
   ],
   custom:"Вставляйте реальный текст тикета/ак-критериев <b>вашего</b> проекта целиком, включая технические детали (ограничения полей, бизнес-правила) — чем конкретнее вход, тем меньше AI придумывает 'от себя'.",
   tip:"Всегда дочитывайте и критически проверяйте результат — AI может предложить кейс, не применимый к вашей системе, или упустить специфичное бизнес-правило, которого нет в тексте требования."},

  {cmd:"Граничные значения", name:"Edge cases для поля", cat:"Проектирование",
   prompt:`Для поля ввода со следующими правилами придумай все граничные
и нетипичные значения для тестирования:

Поле: <span class="ph">[название поля, например "Сумма перевода"]</span>
Правила: <span class="ph">[например: число, от 1 до 100000, до 2 знаков после запятой]</span>

Раздели на: валидные граничные, невалидные граничные, нетипичный ввод
(спецсимволы, unicode, SQL-инъекция, очень длинная строка и т.п.)`,
   out:`Валидные границы: 1, 1.00, 99999.99, 100000
Невалидные границы: 0, 0.999, 100000.01, -1
Нетипичный ввод: "1e10", "100,00", "١٠٠", "' OR 1=1 --", 500-значное число`,
   what:"Генерация граничных значений и 'странного' ввода — область, где AI особенно полезен: он помнит гораздо больше типовых edge-case паттернов (unicode, экспоненциальная запись чисел, SQL-инъекции в поле), чем человек держит в голове на лету.",
   breakdown:[
     {c:"точные правила поля", e:"диапазон, тип, формат — чем точнее описаны ограничения, тем точнее граничные значения"},
     {c:"явные категории (валид/невалид/нетипичный)", e:"структурирует ответ и напоминает проверить не только числа, но и инъекции/спецсимволы"}
   ],
   custom:"Подставьте реальные правила валидации конкретного поля <b>вашего</b> приложения — если точных правил не знаете, сначала уточните их у разработчика, иначе AI будет гадать так же, как и вы.",
   tip:"Используйте этот промпт вместе с техникой граничных значений из карточки 'Boundary Value Analysis' — AI здесь просто ускоряет перебор, сама техника остаётся классической."},

  {cmd:"Баг-репорт", name:"Оформить из описания", cat:"Документирование",
   prompt:`Оформи баг-репорт по стандартному шаблону на основе моего
грубого описания ниже. Исправь формулировки на нейтральные и точные.

Моё описание: <span class="ph">[опиши своими словами, что увидел]</span>
Окружение: <span class="ph">[браузер/ОС/версия приложения]</span>

Структура: Заголовок, Шаги воспроизведения, Фактический результат,
Ожидаемый результат, Severity (с обоснованием).`,
   out:`Заголовок: Кнопка "Оформить заказ" неактивна при заполненной корзине

Шаги:
1. Добавить товар в корзину
2. Перейти в раздел "Корзина"
3. Нажать "Оформить заказ"

Фактический результат: кнопка не реагирует на клик
Ожидаемый результат: переход на страницу оформления
Severity: High — блокирует ключевой сценарий покупки`,
   what:"Превращает сырые заметки ('кнопка не работает, я такой кликнул, а там ничего') в формальный баг-репорт с нейтральной формулировкой — экономит время на оформление и убирает эмоциональные/неточные выражения.",
   breakdown:[
     {c:"\"грубое описание\"", e:"можно писать как есть, даже сумбурно — задача AI именно причесать текст, а не придумать детали"},
     {c:"\"исправь на нейтральные формулировки\"", e:"убирает случайные оценочные слова вроде 'ужасно тормозит' в пользу фактов"},
     {c:"явный запрос Severity с обоснованием", e:"заставляет модель аргументировать оценку, а не просто проставить наугад"}
   ],
   custom:"Указывайте в описании только то, что РЕАЛЬНО наблюдали в <b>вашем</b> приложении — не просите AI 'додумать' фактический результат, он должен быть основан на том, что вы увидели, а не на предположении модели.",
   warn:"Никогда не позволяйте AI самому придумывать шаги воспроизведения, которые вы не проверяли — он может сгенерировать правдоподобный, но неверный сценарий; шаги должны быть ровно теми, что вы выполнили."},

  {cmd:"Объяснить ошибку", name:"Разбор стектрейса/лога", cat:"Диагностика",
   prompt:`Объясни простыми словами, что означает эта ошибка и в каком
модуле/слое системы она вероятнее всего возникла. Не предлагай
исправление кода, я тестировщик — нужно понять причину для баг-репорта.

Ошибка:
<span class="ph">[вставь текст ошибки / стектрейс / строки лога]</span>`,
   out:`TypeError: Cannot read properties of undefined (reading 'name')
  at renderUser (app.js:142)

Объяснение: код пытается прочитать поле .name у объекта user,
но user в этот момент равен undefined — то есть данные
пользователя ещё не пришли с сервера (или запрос упал)
к моменту отрисовки компонента. Вероятно, проблема
в порядке загрузки данных на фронтенде.`,
   what:"Когда в Console DevTools или логе backend встречается непонятная ошибка — AI помогает быстро понять её человеческим языком, не дожидаясь разработчика. Полезно именно для понимания причины при составлении точного баг-репорта, а не для написания фикса.",
   breakdown:[
     {c:"\"не предлагай исправление кода\"", e:"держит ответ в зоне ответственности тестировщика — объяснение, а не решение, которое вы не должны предлагать вместо разработчика"},
     {c:"\"для баг-репорта\"", e:"задаёт нужный уровень детализации — достаточно технический, но понятный без глубокого знания кодовой базы"}
   ],
   custom:"Копируйте ошибку из <b>вашего</b> приложения как есть, с полным стектрейсом, если он виден в DevTools/логах — чем больше контекста (номера строк, имена функций), тем точнее объяснение.",
   tip:"Это отлично работает как промежуточный шаг: сначала поймите ошибку с помощью AI, потом уже решайте, достаточно ли этого для баг-репорта или нужно привлечь разработчика для более глубокого анализа."},

  {cmd:"Тестовые данные", name:"Генерация JSON/CSV", cat:"Подготовка данных",
   prompt:`Сгенерируй 10 тестовых записей в формате JSON по следующей схеме,
включи разнообразные реалистичные значения, в том числе несколько
граничных случаев (пустая строка, максимальная длина, спецсимволы).

Схема:
<span class="ph">[опиши поля и их типы/ограничения]</span>`,
   out:`[
  { <span class="jkey">"email"</span>: <span class="str">"ivan.petrov@mail.com"</span>, <span class="jkey">"age"</span>: <span class="num">34</span> },
  { <span class="jkey">"email"</span>: <span class="str">"a@b.co"</span>, <span class="jkey">"age"</span>: <span class="num">18</span> },
  { <span class="jkey">"email"</span>: <span class="str">""</span>, <span class="jkey">"age"</span>: <span class="num">0</span> },
  ...
]`,
   what:"Быстрая генерация реалистичных наборов тестовых данных для наполнения БД, тестов API или проверки импорта — вместо ручного придумывания 10-20 строк с именами/email/датами.",
   breakdown:[
     {c:"точная схема полей", e:"типы, ограничения, формат — без этого AI угадывает структуру произвольно"},
     {c:"явный запрос граничных случаев", e:"иначе получите только 'идеальные' данные без пустых строк и крайних значений"}
   ],
   custom:"Опишите реальную схему данных <b>вашего</b> проекта (можно взять прямо из API-документации или DDL таблицы) — тогда сгенерированные данные сразу подойдут для импорта через INSERT/API без ручной доработки формата.",
   warn:"Не используйте сгенерированные AI 'реалистичные' email/имена как настоящие личные данные в системах с реальными уведомлениями (email, SMS) — используйте тестовые домены (@example.com) во избежание случайной отправки реальным людям."},

  {cmd:"Автотест из шагов", name:"Ручные шаги → Playwright", cat:"Автоматизация",
   prompt:`Преврати эти ручные шаги тест-кейса в автотест на Playwright + TypeScript.
Используй getByRole/getByTestId для локаторов, добавь осмысленные
assertions на каждый ключевой шаг.

Шаги:
<span class="ph">[вставь шаги тест-кейса построчно]</span>

Селекторы/testid, которые уже известны:
<span class="ph">[перечисли, если знаешь конкретные data-testid]</span>`,
   out:`test('successful login', async ({ page }) => {
  await page.goto('/login');
  await page.getByTestId('email').fill('user@mail.com');
  await page.getByTestId('password').fill('pass123');
  await page.getByRole('button', { name: 'Войти' }).click();
  await expect(page).toHaveURL(/\\/dashboard/);
});`,
   what:"Ускоряет перевод уже написанного и проверенного вручную тест-кейса в код автотеста — особенно полезно для начинающих в автоматизации, когда структура Playwright ещё не 'в руках', но логика сценария уже понятна.",
   breakdown:[
     {c:"конкретные ручные шаги", e:"чем детальнее шаги (какая именно кнопка, какое поле), тем точнее получившийся код"},
     {c:"известные testid", e:"если они у вас уже есть — AI использует их вместо угадывания селекторов 'из головы', что частая причина нерабочего сгенерированного кода"}
   ],
   custom:"Указывайте реальные data-testid/роли элементов <b>вашего</b> приложения, если они вам известны (посмотреть можно в Elements DevTools) — без них AI сгенерирует правдоподобный, но не рабочий код с придуманными селекторами.",
   warn:"Всегда запускайте сгенерированный тест перед коммитом — AI может ошибиться с реальным поведением конкретного элемента (например async-загрузка), код нужно проверить, а не слепо доверять."},

  {cmd:"Ревью тест-кейсов", name:"Найти пробелы в покрытии", cat:"Проверка качества",
   prompt:`Выступи в роли строгого ревьюера тест-кейсов. Проанализируй
набор ниже и укажи: какие сценарии пропущены, какие шаги
неоднозначны, какие кейсы дублируют друг друга.

Мои тест-кейсы:
<span class="ph">[вставь список/таблицу тест-кейсов]</span>

Контекст фичи (для понимания бизнес-логики):
<span class="ph">[кратко опиши, что делает фича]</span>`,
   out:`Пропущено:
- Нет кейса на одновременное использование двух промокодов
- Не покрыт сценарий истёкшей сессии при оформлении заказа

Неоднозначно:
- TC-07 "Проверить корзину" — не указано ЧТО именно проверять

Дублирование:
- TC-03 и TC-11 проверяют одно и то же разными словами`,
   what:"AI как 'второй набор глаз' для вашего набора тест-кейсов перед тем, как показать его команде — находит очевидные пробелы в покрытии и нечёткие формулировки, которые сложно заметить в собственном тексте.",
   breakdown:[
     {c:"\"строгий ревьюер\"", e:"задаёт критический, а не одобрительный тон ответа — иначе модель склонна просто хвалить предложенное"},
     {c:"контекст фичи отдельно от кейсов", e:"без понимания бизнес-логики AI не сможет заметить содержательные пробелы, только текстовые проблемы"}
   ],
   custom:"Описывайте контекст фичи <b>вашего</b> продукта так, будто объясняете новому коллеге с нуля — включая неочевидные бизнес-правила (например 'промокоды нельзя комбинировать'), иначе AI не узнает, что именно стоит проверить дополнительно.",
   tip:"Это не замена ревью от коллеги-человека, особенно по доменной специфике продукта, но хороший бесплатный первый проход перед тем, как отправлять кейсы на ревью команде."},

  {cmd:"Анализ логов", name:"Найти причину в большом логе", cat:"Диагностика",
   prompt:`Вот фрагмент логов за период, когда произошла проблема.
Найди подозрительные строки (ошибки, таймауты, аномалии)
и предположи вероятную последовательность событий, приведшую к сбою.
Если данных недостаточно для однозначного вывода — укажи, что именно
нужно проверить дополнительно.

Логи:
<span class="ph">[вставь фрагмент лога, который получилось собрать]</span>`,
   out:`Подозрительная последовательность:
12:40:01 DB connection pool exhausted (warning)
12:40:15 Payment request timeout
12:40:16 Order status stuck in "processing"

Вероятная причина: исчерпание пула соединений с БД
привело к таймауту запроса к платёжному сервису.

Недостаточно данных: не видно логов самого
Payment Service — нужно запросить их отдельно.`,
   what:"Когда лог большой и непонятно, с какой строки начинать искать — AI может быстро выделить подозрительные паттерны (ошибки, таймауты рядом по времени) и предложить гипотезу цепочки событий, которую вы уже целенаправленно проверяете дальше.",
   breakdown:[
     {c:"\"если данных недостаточно — укажи что проверить\"", e:"критически важная инструкция: без неё модель иногда 'додумывает' уверенный вывод там, где данных реально не хватает"},
     {c:"фрагмент именно за нужный период", e:"не весь лог за день — иначе релевантный сигнал потеряется в шуме"}
   ],
   custom:"Вставляйте логи <b>вашего</b> приложения как есть, по возможности с нескольких связанных сервисов за один и тот же временной отрезок (см. карточку 'Correlation ID' из темы микросервисов) — это резко повышает качество гипотезы.",
   warn:"Относитесь к выводу AI как к гипотезе для проверки, а не к готовому диагнозу для баг-репорта — подтверждайте её реальными данными (трейсом, повторным воспроизведением) перед тем как указывать как 'причину' в тикете."},

  {cmd:"SQL по описанию", name:"Запрос для проверки в БД", cat:"Проверка данных",
   prompt:`Напиши SQL-запрос для проверки следующего условия в базе данных.
Структура таблиц (упрощённо):
<span class="ph">[перечисли таблицы и ключевые поля, которые знаешь]</span>

Что нужно проверить:
<span class="ph">[опиши своими словами, что хочешь найти]</span>`,
   out:`SELECT u.id, u.email, COUNT(o.id) AS orders_count
FROM users u
LEFT JOIN orders o ON o.user_id = u.id
WHERE u.status = 'active'
GROUP BY u.id, u.email
HAVING COUNT(o.id) = 0;

-- найдёт активных пользователей без единого заказа`,
   what:"Когда нужно быстро проверить гипотезу в БД, но синтаксис конкретного JOIN/GROUP BY вспоминается не сразу — AI пишет запрос по словесному описанию условия, вам остаётся только выполнить его и проверить результат.",
   breakdown:[
     {c:"структура таблиц", e:"даже примерная (имена таблиц и полей) сильно повышает шанс получить рабочий запрос с первого раза"},
     {c:"словесное условие, а не готовый SQL", e:"формулируйте на естественном языке то, что хотите узнать — синтаксис оставьте модели"}
   ],
   custom:"Указывайте реальные имена таблиц/столбцов <b>вашей</b> БД (DESCRIBE/\\d команда из карточки 'SELECT + WHERE') — без них AI угадает правдоподобные, но несуществующие в вашей схеме имена.",
   tip:"Всегда сначала прогоняйте сгенерированный запрос как SELECT, даже если в итоге вам нужен UPDATE/DELETE — попросите AI сначала написать именно SELECT-версию для проверки, какие строки затронутся."},

  {cmd:"API-тест по описанию", name:"curl / Postman-тест", cat:"API",
   prompt:`Напиши запрос curl и соответствующий тест для Postman
(вкладка Tests, pm.test) для проверки следующего эндпоинта.

Эндпоинт: <span class="ph">[метод и путь, например POST /api/orders]</span>
Ожидаемое поведение: <span class="ph">[опиши, что должно произойти]</span>
Пример тела запроса (если нужно): <span class="ph">[JSON]</span>`,
   out:`curl -X POST https://api.app.test/orders \\
  -H "Content-Type: application/json" \\
  -d '{"productId":105,"qty":2}'

// Postman Tests:
pm.test("Status 201", () => {
  pm.response.to.have.status(201);
});
pm.test("Has order_id", () => {
  pm.expect(pm.response.json().order_id).to.exist;
});`,
   what:"Быстро получить готовый curl для ручной проверки и сразу тест-скрипт для Postman по словесному описанию ожидаемого поведения эндпоинта — не нужно вспоминать точный синтаксис pm.test или флаги curl на лету.",
   breakdown:[
     {c:"метод и путь эндпоинта", e:"минимально необходимая информация, без неё AI не сможет написать корректный URL/метод"},
     {c:"ожидаемое поведение словами", e:"модель сама превратит его в конкретные pm.test проверки — статус-код, наличие полей и т.п."}
   ],
   custom:"Подставляйте реальный базовый URL и структуру запроса <b>вашего</b> API — если есть точная OpenAPI/Swagger документация, вставьте релевантный фрагмент прямо в промпт для максимальной точности.",
   tip:"Для защищённых эндпоинтов сразу уточните в промпте, что нужен заголовок Authorization с переменной {{token}} — иначе AI может забыть про авторизацию в сгенерированном примере."}
],
en: [
  {cmd:"Test Cases", name:"From Requirements/User Story", cat:"Design",
   prompt:`You are an experienced QA engineer. Based on the requirement below, write a set of test cases.

Requirement:
<span class="ph">[paste the user story or feature description]</span>

For each test case, include: title, preconditions, steps, expected result.
Cover: positive scenarios, negative scenarios, boundary values.
Format: a table.`,
   out:`| ID | Title | Steps | Expected |
| TC-01 | Successful login | ... | Redirect to dashboard |
| TC-02 | Empty password | ... | Validation error |
| TC-03 | 101 chars in field | ... | Field truncated/error |`,
   what:"The most common everyday request: turning a requirement or ticket into a structured set of test cases. AI is good at finding obvious positive scenarios and some boundary cases, but it doesn't replace your product knowledge — the final completeness check is always on you.",
   breakdown:[
     {c:"the role (\"experienced QA engineer\")", e:"sets the context and tone of the response — without it the model tends to give a more generic, less professional result"},
     {c:"explicitly listing the coverage", e:"positive/negative/boundary — without this hint the model often sticks to just the 'happy path'"},
     {c:"the response format", e:"a table — ready to paste straight into a test-case manager (TestRail, Zephyr, Excel)"}
   ],
   custom:"Paste in the full real text of <b>your</b> project's ticket/acceptance criteria, including technical details (field limits, business rules) — the more specific the input, the less the AI has to invent on its own.",
   tip:"Always read through and critically check the result — AI can suggest a case that doesn't apply to your system, or miss a specific business rule that isn't in the requirement text."},

  {cmd:"Boundary Values", name:"Edge Cases for a Field", cat:"Design",
   prompt:`For an input field with the following rules, come up with every boundary
and unusual value worth testing:

Field: <span class="ph">[field name, e.g. "Transfer amount"]</span>
Rules: <span class="ph">[e.g.: number, from 1 to 100000, up to 2 decimal places]</span>

Split into: valid boundaries, invalid boundaries, unusual input
(special characters, unicode, SQL injection, a very long string, etc.)`,
   out:`Valid boundaries: 1, 1.00, 99999.99, 100000
Invalid boundaries: 0, 0.999, 100000.01, -1
Unusual input: "1e10", "100,00", "١٠٠", "' OR 1=1 --", a 500-digit number`,
   what:"Generating boundary values and 'weird' input is an area where AI is especially useful: it remembers far more typical edge-case patterns (unicode, exponential number notation, SQL injection in a field) than a human keeps in mind on the fly.",
   breakdown:[
     {c:"the field's exact rules", e:"range, type, format — the more precisely the constraints are described, the more precise the boundary values"},
     {c:"explicit categories (valid/invalid/unusual)", e:"structures the answer and reminds it to check not just numbers but injections/special characters too"}
   ],
   custom:"Fill in the real validation rules of a specific field in <b>your</b> app — if you don't know the exact rules, check with a developer first, otherwise the AI is just guessing the same as you would.",
   tip:"Use this prompt together with the boundary-value technique from the 'Boundary Value Analysis' card — AI just speeds up the enumeration here, the technique itself stays classic."},

  {cmd:"Bug Report", name:"Format from a Description", cat:"Documentation",
   prompt:`Format this into a bug report using the standard template, based on
my rough description below. Rewrite the wording to be neutral and precise.

My description: <span class="ph">[describe in your own words what you saw]</span>
Environment: <span class="ph">[browser/OS/app version]</span>

Structure: Title, Steps to Reproduce, Actual Result,
Expected Result, Severity (with justification).`,
   out:`Title: "Checkout" button is inactive with a filled cart

Steps:
1. Add an item to the cart
2. Go to the "Cart" section
3. Click "Checkout"

Actual result: the button doesn't respond to clicks
Expected result: navigate to the checkout page
Severity: High — blocks the core purchase flow`,
   what:"Turns raw notes ('the button doesn't work, I clicked it like this and nothing happened') into a formal bug report with neutral wording — saves time on formatting and strips out emotional or imprecise language.",
   breakdown:[
     {c:"\"my rough description\"", e:"you can write it exactly as it comes, even messily — the AI's job is to clean up the text, not invent details"},
     {c:"\"rewrite to be neutral\"", e:"removes stray judgment words like 'terribly slow' in favor of facts"},
     {c:"explicitly asking for Severity with justification", e:"forces the model to argue for its assessment, instead of just picking one at random"}
   ],
   custom:"Only describe what you ACTUALLY observed in <b>your</b> app — don't ask the AI to 'fill in' the actual result; it should be based on what you saw, not on the model's assumption.",
   warn:"Never let the AI invent reproduction steps you didn't actually test — it can generate a plausible but wrong scenario; the steps must be exactly the ones you performed."},

  {cmd:"Explain an Error", name:"Parsing a Stack Trace/Log", cat:"Diagnostics",
   prompt:`Explain in plain language what this error means and which module/layer
of the system it most likely came from. Don't suggest a code fix —
I'm a tester, I need to understand the cause for a bug report.

Error:
<span class="ph">[paste the error text / stack trace / log lines]</span>`,
   out:`TypeError: Cannot read properties of undefined (reading 'name')
  at renderUser (app.js:142)

Explanation: the code tries to read the .name field on the user object,
but user is undefined at that moment — meaning the user's data
hasn't arrived from the server yet (or the request failed)
by the time the component renders. Likely a data-loading
order issue on the frontend.`,
   what:"When Console DevTools or a backend log shows a confusing error, AI helps understand it in plain language fast, without waiting on a developer. Useful specifically for understanding the cause when writing a precise bug report, not for writing a fix.",
   breakdown:[
     {c:"\"don't suggest a code fix\"", e:"keeps the answer in a tester's territory — an explanation, not a solution you shouldn't be proposing instead of a developer"},
     {c:"\"for a bug report\"", e:"sets the right level of detail — technical enough, but understandable without deep codebase knowledge"}
   ],
   custom:"Copy the error from <b>your</b> app as-is, with the full stack trace if it's visible in DevTools/logs — the more context (line numbers, function names), the more precise the explanation.",
   tip:"This works great as an intermediate step: first understand the error with AI's help, then decide whether that's enough for a bug report or whether a developer needs to dig deeper."},

  {cmd:"Test Data", name:"Generating JSON/CSV", cat:"Preparing Data",
   prompt:`Generate 10 test records in JSON format following this schema,
include a variety of realistic values, including a few boundary
cases (an empty string, max length, special characters).

Schema:
<span class="ph">[describe the fields and their types/constraints]</span>`,
   out:`[
  { <span class="jkey">"email"</span>: <span class="str">"ivan.petrov@mail.com"</span>, <span class="jkey">"age"</span>: <span class="num">34</span> },
  { <span class="jkey">"email"</span>: <span class="str">"a@b.co"</span>, <span class="jkey">"age"</span>: <span class="num">18</span> },
  { <span class="jkey">"email"</span>: <span class="str">""</span>, <span class="jkey">"age"</span>: <span class="num">0</span> },
  ...
]`,
   what:"Fast generation of realistic test-data sets for seeding a database, API tests, or checking an import — instead of manually inventing 10-20 rows of names/emails/dates.",
   breakdown:[
     {c:"an exact field schema", e:"types, constraints, format — without this AI guesses the structure arbitrarily"},
     {c:"explicitly asking for boundary cases", e:"otherwise you'll only get 'ideal' data with no empty strings or extreme values"}
   ],
   custom:"Describe the real data schema of <b>your</b> project (you can take it straight from API docs or a table's DDL) — the generated data will then be ready to import via INSERT/API with no manual reformatting.",
   warn:"Don't use AI-generated 'realistic' emails/names as real personal data in systems with real notifications (email, SMS) — use test domains (@example.com) to avoid accidentally messaging real people."},

  {cmd:"Automated Test from Steps", name:"Manual Steps → Playwright", cat:"Automation",
   prompt:`Turn these manual test-case steps into an automated test in Playwright + TypeScript.
Use getByRole/getByTestId for locators, add meaningful
assertions at each key step.

Steps:
<span class="ph">[paste the test case steps, one per line]</span>

Selectors/testids already known:
<span class="ph">[list any specific data-testid you know]</span>`,
   out:`test('successful login', async ({ page }) => {
  await page.goto('/login');
  await page.getByTestId('email').fill('user@mail.com');
  await page.getByTestId('password').fill('pass123');
  await page.getByRole('button', { name: 'Log in' }).click();
  await expect(page).toHaveURL(/\\/dashboard/);
});`,
   what:"Speeds up turning an already-written, manually verified test case into automated-test code — especially useful for beginners in automation, when Playwright's structure isn't 'in your hands' yet but the scenario's logic is already clear.",
   breakdown:[
     {c:"specific manual steps", e:"the more detailed the steps (which exact button, which field), the more precise the resulting code"},
     {c:"known testids", e:"if you already have them, AI uses them instead of guessing selectors 'from thin air' — a common cause of non-working generated code"}
   ],
   custom:"Provide the real data-testid/roles of elements in <b>your</b> app, if you know them (check Elements in DevTools) — without them AI generates plausible-looking but non-functional code with made-up selectors.",
   warn:"Always run the generated test before committing — AI can get a specific element's real behavior wrong (e.g. async loading); the code needs checking, not blind trust."},

  {cmd:"Test Case Review", name:"Finding Coverage Gaps", cat:"Quality Check",
   prompt:`Act as a strict test-case reviewer. Analyze the set below and point out:
which scenarios are missing, which steps are ambiguous,
which cases duplicate each other.

My test cases:
<span class="ph">[paste the list/table of test cases]</span>

Feature context (to understand the business logic):
<span class="ph">[briefly describe what the feature does]</span>`,
   out:`Missing:
- No case for using two promo codes at once
- Expired-session scenario during checkout isn't covered

Ambiguous:
- TC-07 "Check the cart" — doesn't say WHAT exactly to check

Duplicates:
- TC-03 and TC-11 check the same thing in different words`,
   what:"AI as a 'second pair of eyes' on your test-case set before showing it to the team — finds obvious coverage gaps and vague wording that are hard to spot in your own writing.",
   breakdown:[
     {c:"\"strict reviewer\"", e:"sets a critical rather than approving tone for the response — otherwise the model tends to just praise what's there"},
     {c:"feature context, separate from the cases", e:"without understanding the business logic, AI can't spot substantive gaps, only textual issues"}
   ],
   custom:"Describe the feature context in <b>your</b> product as if explaining it to a new colleague from scratch — including non-obvious business rules (e.g. 'promo codes can't be combined'), otherwise AI won't know what's actually worth checking further.",
   tip:"This isn't a substitute for review by a human colleague, especially for domain-specific knowledge, but it's a good free first pass before sending cases for team review."},

  {cmd:"Log Analysis", name:"Finding the Cause in a Large Log", cat:"Diagnostics",
   prompt:`Here's a log excerpt from the period when the problem happened.
Find suspicious lines (errors, timeouts, anomalies) and suggest
a likely sequence of events that led to the failure.
If there isn't enough data for a clear conclusion, say exactly
what else needs to be checked.

Logs:
<span class="ph">[paste the log excerpt you managed to collect]</span>`,
   out:`Suspicious sequence:
12:40:01 DB connection pool exhausted (warning)
12:40:15 Payment request timeout
12:40:16 Order status stuck in "processing"

Likely cause: the DB connection pool being exhausted
led to a timeout on the payment service request.

Not enough data: no logs visible from
Payment Service itself — worth requesting those separately.`,
   what:"When a log is huge and it's unclear which line to start from, AI can quickly highlight suspicious patterns (errors, timeouts close together in time) and suggest a hypothesis for the event chain, which you then go check deliberately.",
   breakdown:[
     {c:"\"if there isn't enough data, say what to check\"", e:"a critical instruction: without it the model sometimes 'invents' a confident conclusion where the data genuinely isn't enough"},
     {c:"an excerpt from the exact relevant period", e:"not the whole day's log — otherwise the relevant signal gets lost in noise"}
   ],
   custom:"Paste in <b>your</b> app's logs as-is, ideally from several related services over the same time window (see the 'Correlation ID' card from the microservices topic) — this sharply improves the quality of the hypothesis.",
   warn:"Treat the AI's output as a hypothesis to verify, not a finished diagnosis for a bug report — confirm it with real data (a trace, reproducing it again) before stating it as the 'cause' in a ticket."},

  {cmd:"SQL from a Description", name:"A Query to Check the DB", cat:"Checking Data",
   prompt:`Write a SQL query to check the following condition in the database.
Table structure (simplified):
<span class="ph">[list the tables and key fields you know]</span>

What needs to be checked:
<span class="ph">[describe in your own words what you want to find]</span>`,
   out:`SELECT u.id, u.email, COUNT(o.id) AS orders_count
FROM users u
LEFT JOIN orders o ON o.user_id = u.id
WHERE u.status = 'active'
GROUP BY u.id, u.email
HAVING COUNT(o.id) = 0;

-- finds active users with zero orders`,
   what:"When you need to quickly check a hypothesis in the database but the exact JOIN/GROUP BY syntax doesn't come to mind right away, AI writes the query from a plain-language description of the condition — you just run it and check the result.",
   breakdown:[
     {c:"the table structure", e:"even an approximate one (table and field names) greatly raises the chance of a working query on the first try"},
     {c:"a plain-language condition, not ready-made SQL", e:"describe in natural language what you want to know — leave the syntax to the model"}
   ],
   custom:"Give the real table/column names of <b>your</b> database (the DESCRIBE/\\d command from the 'SELECT + WHERE' card) — without them AI will guess plausible-sounding names that don't exist in your actual schema.",
   tip:"Always run the generated query as a SELECT first, even if you ultimately need an UPDATE/DELETE — ask AI to write the SELECT version first to check which rows would be affected."},

  {cmd:"API Test from a Description", name:"curl / a Postman Test", cat:"API",
   prompt:`Write a curl request and a matching Postman test
(the Tests tab, pm.test) to check the following endpoint.

Endpoint: <span class="ph">[method and path, e.g. POST /api/orders]</span>
Expected behavior: <span class="ph">[describe what should happen]</span>
Example request body (if needed): <span class="ph">[JSON]</span>`,
   out:`curl -X POST https://api.app.test/orders \\
  -H "Content-Type: application/json" \\
  -d '{"productId":105,"qty":2}'

// Postman Tests:
pm.test("Status 201", () => {
  pm.response.to.have.status(201);
});
pm.test("Has order_id", () => {
  pm.expect(pm.response.json().order_id).to.exist;
});`,
   what:"Quickly get a ready-made curl for manual checking and a matching Postman test script, from a plain-language description of an endpoint's expected behavior — no need to recall the exact pm.test syntax or curl flags on the fly.",
   breakdown:[
     {c:"the endpoint's method and path", e:"the minimum info needed — without it AI can't write a correct URL/method"},
     {c:"expected behavior in words", e:"the model turns it into concrete pm.test checks itself — status code, presence of fields, etc."}
   ],
   custom:"Fill in the real base URL and request structure of <b>your</b> API — if you have precise OpenAPI/Swagger docs, paste the relevant fragment right into the prompt for maximum accuracy.",
   tip:"For protected endpoints, mention right in the prompt that you need an Authorization header with a {{token}} variable — otherwise AI might forget authorization in the generated example."}
]
};

const list = document.getElementById('list');
const panel = document.getElementById('panel');
let currentIndex = 0;
let currentLang = localStorage.getItem(LANG_KEY) || 'ru';

function stripHtml(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || '';
}

function render(i){
  currentIndex = i;
  const tools = toolsData[currentLang];
  const L = labels[currentLang];

  list.innerHTML = tools.map((t,idx)=>`
    <div class="item ${idx===i?'active':''}" data-i="${idx}">
      <div class="badge">${idx+1}</div>
      <div class="names">
        <div class="cmd">${t.cmd}</div>
        <div class="desc">${t.name}</div>
      </div>
    </div>`).join('');

  const t = tools[i];
  const breakdownHTML = t.breakdown.map(b=>`
    <div class="brow"><code>${b.c}</code><span class="expl">${b.e}</span></div>
  `).join('');

  panel.innerHTML = `
    <div class="term">
      <div class="term-bar">
        <div class="label"><div class="dot" style="background:#ff5f56"></div><div class="dot" style="background:#ffbd2e"></div><div class="dot" style="background:#27c93f"></div>&nbsp;${L.promptTab}</div>
        <button class="copy-btn" id="copyBtn">${L.copy}</button>
      </div>
      <div class="prompt-body" id="promptText">${t.prompt}</div>
      <div class="sub-label">${L.exampleOut}</div>
      <div class="example-out"><pre style="margin:0;white-space:pre-wrap;font-family:inherit;">${t.out}</pre></div>
    </div>

    <div class="section-title">🤖 ${t.cmd}</div>
    <div class="meta"><span class="category">${t.cat}</span></div>

    <div class="block-title">${L.what}</div>
    <div class="what">${t.what}</div>

    <div class="block-title">${L.breakdown}</div>
    <div class="breakdown">${breakdownHTML}</div>

    <div class="block-title">${L.custom}</div>
    <div class="custom">${t.custom}</div>

    ${t.tip ? `<div class="tip">💡 ${t.tip}</div>` : ''}
    ${t.warn ? `<div class="warn">⚠️ ${t.warn}</div>` : ''}
  `;

  list.querySelectorAll('.item').forEach(el=>{
    el.onclick = ()=>render(parseInt(el.dataset.i));
  });

  const copyBtn = document.getElementById('copyBtn');
  copyBtn.onclick = () => {
    const text = stripHtml(t.prompt);
    const showCopied = () => {
      copyBtn.textContent = L.copied;
      copyBtn.classList.add('copied');
      setTimeout(()=>{ copyBtn.textContent=L.copy; copyBtn.classList.remove('copied'); }, 1500);
    };
    const fallbackCopy = () => {
      // works even without the Clipboard API (e.g. opening the file directly, not via http/https)
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch(e) {}
      document.body.removeChild(ta);
      if (ok) { showCopied(); }
      else {
        copyBtn.textContent = L.error;
        setTimeout(()=>{ copyBtn.textContent=L.copy; }, 1500);
      }
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(showCopied).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }
  };
}

function applyLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang === 'ru' ? 'ru' : 'en';
  document.getElementById('backLink').textContent = labels[lang].back;
  document.getElementById('pageFooter').textContent = labels[lang].footer;
  document.getElementById('pageTitle').innerHTML = pageTitleHTML[lang];
  document.querySelectorAll('#langToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  localStorage.setItem(LANG_KEY, lang);
  const idx = Math.min(currentIndex, toolsData[lang].length - 1);
  render(idx);
}

document.querySelectorAll('#langToggle button').forEach(b => {
  b.addEventListener('click', () => applyLang(b.dataset.lang));
});

applyLang(currentLang);
</script>
</body>
</html>
